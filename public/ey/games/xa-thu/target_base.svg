<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <filter id="targetShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <linearGradient id="goldRimGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#f59e0b"/>
      <stop offset="70%" stop-color="#d97706"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <linearGradient id="innerFaceGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f5f2e8"/>
    </linearGradient>
    <radialGradient id="redRingGrad" cx="40%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="80%" stop-color="#b91c1c"/>
      <stop offset="100%" stop-color="#7f1d1d"/>
    </radialGradient>
  </defs>

  <!-- Shadow & Outer Gold Rim -->
  <circle cx="100" cy="100" r="94" fill="url(#goldRimGrad)" filter="url(#targetShadow)"/>
  <!-- Gold inner bevel edge -->
  <circle cx="100" cy="100" r="88" fill="#a16207" opacity="0.3"/>
  
  <!-- Outer Cream / White Spacer -->
  <circle cx="100" cy="100" r="85" fill="#fdfcf7"/>
  
  <!-- Main Crimson Red Ring -->
  <circle cx="100" cy="100" r="80" fill="url(#redRingGrad)"/>
  
  <!-- Glossy Crescent Highlight on Red Ring -->
  <path d="M 40 45 A 76 76 0 0 1 125 25 A 72 72 0 0 0 45 60 Z" fill="#ffffff" opacity="0.42"/>
  
  <!-- Inner White Spacer -->
  <circle cx="100" cy="100" r="63" fill="#fdfcf7"/>
  
  <!-- Secondary Thin Red Ring -->
  <circle cx="100" cy="100" r="60" fill="none" stroke="#b91c1c" stroke-width="4"/>
  
  <!-- Inner Ivory Face -->
  <circle cx="100" cy="100" r="54" fill="url(#innerFaceGrad)"/>
  <circle cx="100" cy="100" r="54" fill="none" stroke="#e2dfd2" stroke-width="1.5"/>
</svg>
