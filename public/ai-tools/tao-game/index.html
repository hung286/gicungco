<!DOCTYPE html>
<html lang="vi">
<head>
  <script src="/ey/modules/auth/firebaseService.js?v=20261118"></script>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Tạo Game Nhanh - MHEdu</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Nunito:wght@400;600;700;800;900&family=Quicksand:wght@500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }
  </style>

  <!-- JSZip for SCORM packaging -->
  <script src="./assets/jszip.min.js"></script>

  <!-- React 18 & ReactDOM 18 -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
</head>
<body class="bg-slate-50 min-h-screen">

  <!-- MHEdu Top Nav -->
  <header style="background: linear-gradient(135deg, #1e1b4b, #312e81); color: #fff; padding: 10px 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid rgba(255,255,255,0.15); font-family: system-ui, -apple-system, sans-serif; position: sticky; top: 0; z-index: 99999; box-shadow: 0 4px 15px rgba(0,0,0,0.3);">
    <div style="display: flex; align-items: center; gap: 14px;">
      <button onclick="window.history.length > 1 ? window.history.back() : (window.location.href='/games_2/runner.html?game=/ai-tools')" style="background: rgba(255,255,255,0.15); color: #fff; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; padding: 6px 14px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 13px; transition: all 0.2s;">
        <span>←</span> Quay lại Kho MHEdu
      </button>
      <div style="display: flex; align-items: center; gap: 8px;">
        <span style="font-size: 1.2rem;">🕹️</span>
        <span style="font-weight: 800; font-size: 15px; letter-spacing: 0.5px; background: linear-gradient(90deg, #a78bfa, #38bdf8); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">MHEDU AI</span>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 12px;">
      <button id="smartedu-api-key-btn" onclick="openKeyModal()" style="background: #e21b3c; color: #fff; border: none; border-radius: 8px; padding: 6px 14px; font-size: 12px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 6px;">
        🔑 Đổi API Key
      </button>
      <a href="/games_2/runner.html?game=/ai-tools" style="color: #cbd5e1; text-decoration: none; font-size: 13px; font-weight: 600;">Danh mục công cụ</a>
    </div>
  </header>

  <!-- Key Config Modal -->
  <div id="smartedu-key-modal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.7); z-index:100000; align-items:center; justify-content:center;">
    <div style="background:#fff; color:#1e293b; padding:24px; border-radius:16px; max-width:480px; width:90%; box-shadow:0 20px 50px rgba(0,0,0,0.5); font-family:system-ui, sans-serif;">
      <h3 style="margin:0 0 10px 0; font-size:18px; font-weight:800; color:#1e1b4b;">🔑 Cài đặt Google Gemini API Key</h3>
      <p style="font-size:13px; color:#64748b; line-height:1.5; margin-bottom:14px;">
        Hệ thống đã có sẵn key dự phòng. Nếu muốn tốc độ cao nhất và không giới hạn lượt tạo, thầy/cô có thể dán API Key cá nhân từ Google AI Studio vào đây:
      </p>
      <input id="smartedu-key-input" type="password" placeholder="Dán Gemini API Key của bạn (AIzaSy...)" style="width:100%; box-sizing:border-box; padding:10px 12px; border:1px solid #cbd5e1; border-radius:8px; font-size:14px; margin-bottom:16px;" />
      <div style="display:flex; justify-content:flex-end; gap:8px;">
        <button onclick="closeKeyModal()" style="padding:8px 16px; border:1px solid #cbd5e1; background:#f1f5f9; border-radius:8px; font-weight:600; cursor:pointer;">Đóng</button>
        <button onclick="saveKeyModal()" style="padding:8px 16px; border:none; background:#7c4dff; color:#fff; border-radius:8px; font-weight:700; cursor:pointer;">Lưu Key</button>
      </div>
    </div>
  </div>

  <!-- Root App Container -->
  <div id="root"></div>

  <!-- Key modal helper scripts -->
  <script>
    function openKeyModal() {
      document.getElementById('smartedu-key-modal').style.display = 'flex';
      const cur = localStorage.getItem('smartedu_gemini_api_key') || '';
      document.getElementById('smartedu-key-input').value = cur;
    }
    function closeKeyModal() {
      document.getElementById('smartedu-key-modal').style.display = 'none';
    }
    function saveKeyModal() {
      const val = document.getElementById('smartedu-key-input').value.trim();
      if (val) {
        localStorage.setItem('smartedu_gemini_api_key', val);
        alert('Đã lưu API Key thành công! Các lượt tạo tiếp theo sẽ dùng key của bạn.');
      } else {
        localStorage.removeItem('smartedu_gemini_api_key');
        alert('Đã xóa key cá nhân, chuyển về key dự phòng của hệ thống.');
      }
      closeKeyModal();
    }
  </script>

  <!-- App logic bundle -->
  <script type="module" src="./app.bundle.js"></script>

</body>
</html>
