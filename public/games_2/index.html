  <!-- Route Dispatcher trước khi React Router khởi động -->
  <script>
    (function() {
      // 1. Đồng bộ câu hỏi từ SmartEdu Play vào localStorage của SmartEdu Play
      try {
        const smartEduQs = sessionStorage.getItem('smartedu_imath_questions');
        if (smartEduQs) {
          const parsed = JSON.parse(smartEduQs);
          if (Array.isArray(parsed) && parsed.length > 0) {
            localStorage.setItem('SmartEdu_active_questions', smartEduQs);
            localStorage.setItem('smartedu_questions_bridge', smartEduQs);
          }
        }
      } catch (e) { console.warn('Bridge err:', e); }

      // 2. Chuyển hướng router của SPA sang game được yêu cầu
      const urlParams = new URLSearchParams(window.location.search);
      const targetGame = urlParams.get('game') || urlParams.get('route');
      if (targetGame) {
        const routePath = targetGame.startsWith('/') ? targetGame : ('/' + targetGame);
        if (window.location.pathname !== routePath) {
          window.history.replaceState(null, '', routePath + window.location.search);
        }
      }
    })();
  </script>

  <!-- Main SmartEdu Module (100% unlocked) -->
  <script type="module" crossorigin src="/games_2/assets/index-DnvAnRgE.js"></script>
