  <!-- Route Dispatcher trước khi React Router khởi động -->
  <script>
    (function() {
      // Đồng bộ câu hỏi từ SmartEdu Play vào localStorage của GV game new
      try {
        const smartEduQs = sessionStorage.getItem('smartedu_imath_questions') || localStorage.getItem('smartedu_imath_questions');
        if (smartEduQs) {
          localStorage.setItem('SmartEdu_active_questions', smartEduQs);
          localStorage.setItem('smartedu_questions_bridge', smartEduQs);
        }
      } catch (e) { console.warn('Bridge err:', e); }

      // Chuyển hướng router của SPA sang game được yêu cầu (Giữ nguyên pathname nếu đã vào thẳng route con như /tien-ich-giao-duc)
      const urlParams = new URLSearchParams(window.location.search);
      const currentPath = window.location.pathname;
      const isRunnerOrRoot = currentPath === '/' || currentPath.includes('runner.html') || currentPath.includes('/games_2/index.html');
      const targetGame = urlParams.get('game') || urlParams.get('route') || (isRunnerOrRoot ? '/dashboard' : currentPath);
      if (targetGame) {
        const routePath = targetGame.startsWith('/') ? targetGame : ('/' + targetGame);
        if (window.location.pathname !== routePath) {
          window.history.replaceState(null, '', routePath + window.location.search);
        }
      }

      // Ngăn chặn iframe tự điều hướng ra ngoài tên miền ngoài ý muốn & Hook logo MHEdu về màn hình chính
      window.addEventListener('click', function(e) {
        const logo = e.target.closest('.header-logo, .logo-text, .header-title');
        if (logo) {
          e.preventDefault();
          e.stopPropagation();
          if (window.parent && window.parent !== window) {
            try {
              if (typeof window.parent.closeAllPortals === 'function') {
                window.parent.closeAllPortals();
                return;
              }
            } catch (err) {}
            window.parent.postMessage({ type: 'EXIT_GAME' }, '*');
          } else {
            window.location.href = '/';
          }
          return;
        }

        const anchor = e.target.closest('a');
        if (anchor) {
          const href = anchor.getAttribute('href') || '';
          if (href === 'https://giaoviendoimoi.com' || href === 'https://giaoviendoimoi.com/') {
            e.preventDefault();
            e.stopPropagation();
            if (window.parent && window.parent !== window) {
              window.parent.postMessage({ type: 'EXIT_GAME' }, '*');
            }
          }
        }
      }, true);
    })();
  </script>

<body>
    <!-- Floating Exit Widget: Draggable, Collapsible & Translucent to never obscure questions -->
  <div id="smartedu-exit-widget" class="smartedu-exit-widget" title="Kéo thả để di chuyển, click − để thu nhỏ tránh che câu hỏi">
    <div id="smartedu-exit-drag" class="smartedu-drag-handle" title="Kéo để di chuyển">⠿</div>
    <button class="smartedu-exit-btn" onclick="exitSmartEduGame()" title="Thoát trò chơi về SmartEdu Play">
      🚪 Thoát Game
    </button>
    <button id="smartedu-min-toggle" class="smartedu-min-btn" onclick="toggleSmartEduExitMin(event)" title="Thu nhỏ / Phóng to (tránh che câu hỏi)">
      −
    </button>
  </div>

  <script>
    // Nếu chạy trong iframe của SmartEdu, ẩn ngay widget để không đè thanh công cụ
    if (window.parent && window.parent !== window) {
      document.body.classList.add('is-embedded');
      var wEl = document.getElementById('smartedu-exit-widget');
      if (wEl) wEl.style.display = 'none';
    }
  </script>

  <script>
    function exitSmartEduGame() {
      if (window.parent && window.parent !== window) {
        window.parent.postMessage({ type: 'EXIT_GAME' }, '*');
      } else {
        window.location.href = '/';
      }
    }

    function toggleSmartEduExitMin(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      var widget = document.getElementById('smartedu-exit-widget');
      var toggleBtn = document.getElementById('smartedu-min-toggle');
      if (!widget) return;
      var isMin = widget.classList.toggle('minimized');
      if (toggleBtn) toggleBtn.textContent = isMin ? '+' : '−';
      try { localStorage.setItem('smartedu_exit_min', isMin ? '1' : '0'); } catch(err) {}
    }

    // Draggable behavior & restore position
    (function initDraggableExit() {
      var widget = document.getElementById('smartedu-exit-widget');
      var handle = document.getElementById('smartedu-exit-drag');
      if (!widget) return;

      try {
        if (localStorage.getItem('smartedu_exit_min') === '1') {
          widget.classList.add('minimized');
          var toggleBtn = document.getElementById('smartedu-min-toggle');
          if (toggleBtn) toggleBtn.textContent = '+';
        }
        var savedPos = localStorage.getItem('smartedu_exit_pos');
        if (savedPos) {
          var pos = JSON.parse(savedPos);
          if (pos && typeof pos.x === 'number' && typeof pos.y === 'number') {
            var maxX = window.innerWidth - 60;
            var maxY = window.innerHeight - 40;
            var safeX = Math.max(10, Math.min(maxX, pos.x));
            var safeY = Math.max(10, Math.min(maxY, pos.y));
            widget.style.left = safeX + 'px';
            widget.style.top = safeY + 'px';
            widget.style.right = 'auto';
            widget.style.bottom = 'auto';
          }
        }
      } catch(err) {}

      var isDragging = false;
      var startX = 0, startY = 0;
      var initialLeft = 0, initialTop = 0;

      function onStart(e) {
        if (e.target.tagName === 'BUTTON') return;
        isDragging = true;
        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        var clientY = e.touches ? e.touches[0].clientY : e.clientY;
        startX = clientX;
        startY = clientY;
        var rect = widget.getBoundingClientRect();
        initialLeft = rect.left;
        initialTop = rect.top;
        widget.style.right = 'auto';
        widget.style.bottom = 'auto';
        widget.style.left = initialLeft + 'px';
        widget.style.top = initialTop + 'px';
        widget.style.transition = 'none';
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onEnd);
        document.addEventListener('touchmove', onMove, { passive: false });
        document.addEventListener('touchend', onEnd);
      }

      function onMove(e) {
        if (!isDragging) return;
        var clientX = e.touches ? e.touches[0].clientX : e.clientX;
        var clientY = e.touches ? e.touches[0].clientY : e.clientY;
        var dx = clientX - startX;
        var dy = clientY - startY;
        var newX = Math.max(8, Math.min(window.innerWidth - widget.offsetWidth - 8, initialLeft + dx));
        var newY = Math.max(8, Math.min(window.innerHeight - widget.offsetHeight - 8, initialTop + dy));
        widget.style.left = newX + 'px';
        widget.style.top = newY + 'px';
        if (e.preventDefault) e.preventDefault();
      }

      function onEnd() {
        if (!isDragging) return;
        isDragging = false;
        widget.style.transition = 'opacity 0.2s, box-shadow 0.2s';
        document.removeEventListener('mousemove', onMove);
        document.removeEventListener('mouseup', onEnd);
        document.removeEventListener('touchmove', onMove);
        document.removeEventListener('touchend', onEnd);
        try {
          var rect = widget.getBoundingClientRect();
          localStorage.setItem('smartedu_exit_pos', JSON.stringify({ x: rect.left, y: rect.top }));
        } catch(err) {}
      }

      if (handle) {
        handle.addEventListener('mousedown', onStart);
        handle.addEventListener('touchstart', onStart, { passive: false });
      }
      widget.addEventListener('mousedown', function(e) {
        if (widget.classList.contains('minimized')) onStart(e);
      });
      widget.addEventListener('touchstart', function(e) {
        if (widget.classList.contains('minimized')) onStart(e);
      }, { passive: false });
    })();
  </script>

  <div id="root"></div>

  <!-- Observer dọn dẹp các nút bản quyền / mua FullGame / quota nếu xuất hiện động -->
  <script>
    (function() {
      function cleanPaywalls() {
        document.querySelectorAll('button').forEach(function(btn) {
          var txt = (btn.textContent || '').trim();
          if (txt.includes('Mua FullGame') || txt.includes('Nâng Cấp Lẻ') || txt.includes('Nâng cấp lẻ')) {
            btn.style.setProperty('display', 'none', 'important');
          }
        });
        document.querySelectorAll('div, p, span').forEach(function(el) {
          if (el.id === 'root' || el.classList.contains('pose-quiz-page') || el.classList.contains('app-header')) return;
          var txt = (el.textContent || '').trim();
          if (
            txt.startsWith('Đã sử dụng') ||
            (txt.startsWith('Đã dùng') && txt.includes('lượt')) ||
            txt.includes('Ghim bài để giữ quyền') ||
            txt.includes('Hãy ghim bài yêu thích')
          ) {
            if (el.children.length === 0 || (el.children.length <= 2 && !el.querySelector('button, input, form, table'))) {
              el.style.setProperty('display', 'none', 'important');
            }
          }
        });
      }

      setInterval(cleanPaywalls, 500);
      document.addEventListener('DOMContentLoaded', cleanPaywalls);
    })();
  </script>
