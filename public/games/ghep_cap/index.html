    <script>
        // Offline Leaderboard & Storage Stub
        let isOffline = true;
        async function addDoc() { return true; }
        async function getDocs() { return { docs: [] }; }

        const GAME_LEVELS = {
            1: {
                title: "Nội dung", time: 60,
                pairs: [
                    { id: 1, left: "\\left( A+B \\right)^2", right: "A^2 + 2AB + B^2" },
                    { id: 2, left: "\\left( A-B \\right)^2", right: "A^2 - 2AB + B^2" },
                    { id: 3, left: "A^2 - B^2", right: "\\left( A-B \\right)\\left( A+B \\right)" },
                    { id: 4, left: "\\left( x+1 \\right)^2", right: "x^2 + 2x + 1" },
                    { id: 5, left: "\\left( x-1 \\right)^2", right: "x^2 - 2x + 1" },
                    { id: 6, left: "x^2 - 1", right: "\\left( x-1 \\right)\\left( x+1 \\right)" }
                ]
            }
        };

        // --- Nạp câu hỏi từ SmartEdu Play ---
        try {
            const rawSaved = sessionStorage.getItem('smartedu_imath_questions');
            if (rawSaved) {
                const parsed = JSON.parse(rawSaved);
                if (Array.isArray(parsed) && parsed.length >= 2) {
                    const customPairs = [];
                    parsed.forEach((q, idx) => {
                        let leftText = q.content || `Câu hỏi ${idx + 1}`;
                        // clean up "Câu 1:" prefix
                        leftText = leftText.replace(/^(?:Câu|Bài)\s*\d+[\s.:\-–]*/i, '').trim();
                        if (leftText.length > 70) leftText = leftText.substring(0, 67) + '...';

                        let rightText = '';
                        if (q.options && q.options.length >= 2) {
                            const corr = q.options.find(o => o.is_correct);
                            rightText = corr ? corr.text : q.options[0].text;
                        } else if (q.correct_answer) {
                            rightText = q.correct_answer;
                        } else {
                            rightText = `Đáp án ${idx + 1}`;
                        }
                        if (rightText.length > 60) rightText = rightText.substring(0, 57) + '...';

                        customPairs.push({ id: idx + 1, left: leftText, right: rightText });
                    });

                    if (customPairs.length >= 2) {
                        GAME_LEVELS[1] = {
                            title: "Câu hỏi SmartEdu",
                            time: Math.min(120, Math.max(45, customPairs.length * 15)),
                            pairs: customPairs.slice(0, 8)
                        };
                        if (customPairs.length > 8) {
                            GAME_LEVELS[2] = {
                                title: "Cấp độ 2",
                                time: Math.min(120, (customPairs.length - 8) * 15),
                                pairs: customPairs.slice(8, 16)
                            };
                        }
                        console.log('Ghep Cap loaded custom pairs:', customPairs.length);
                    }
                }
            }
        } catch(e) {
            console.warn('Ghep Cap custom questions parse error:', e);
        }



        
        
        // Safe Web Audio API sound generator
        function playTone(freq, type, duration) {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.value = freq;
                gain.gain.setValueAtTime(0.3, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        const sndMatch = { play: () => { playTone(587.33, 'triangle', 0.15); setTimeout(() => playTone(880, 'sine', 0.25), 100); }, pause: () => {} };
        const sndError = { play: () => { playTone(220, 'sawtooth', 0.2); setTimeout(() => playTone(180, 'sawtooth', 0.25), 120); }, pause: () => {} };


        // State variables
        let gameState = 'start';
        let currentMode = 'all';
        let currentCampaignLevel = 1;
        let totalCampaignScore = 0;
        let totalCampaignTimeUsed = 0;
        
        let currentPairs = [];
        let movingCards = []; 
        let firstCard = null; 
        let matchedIds = [];
        let score = 0, lives = 3, timeLeft = 60;
        let timerInterval, animationFrameId;
        let isAnimating = false;

        const overlay = document.getElementById('overlay');
        const overlayContent = document.getElementById('overlay-content');
        const headerPanel = document.getElementById('header-panel');
        const gameBoard = document.getElementById('game-board');
        const livesContainer = document.getElementById('lives-container');
        const scoreDisplay = document.getElementById('score-display');
        const timerContainer = document.getElementById('timer-container');
        const timerDisplay = document.getElementById('timer-display');
        const levelBadge = document.getElementById('level-badge');

        const svgHeart = `<svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 sm:h-8 sm:w-8" viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M3.172 5.172a4 4 0 015.656 0L10 6.343l1.172-1.171a4 4 0 115.656 5.656L10 17.657l-6.828-6.829a4 4 0 010-5.656z" clip-rule="evenodd" /></svg>`;

        let appId = 'ghep-cap'; 
        let app, auth, db;
        let authPromise = Promise.resolve();

        try {
            if (typeof __app_id !== 'undefined') appId = __app_id;
            if (typeof __firebase_config !== 'undefined') {
                const firebaseConfig = JSON.parse(__firebase_config);
                app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app);
                authPromise = (async () => {
                    try {
                        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) { await signInWithCustomToken(auth, __initial_auth_token); } 
                        else { await signInAnonymously(auth); }
                    } catch (err) { console.warn("Firebase Auth Bypassed."); }
                })();
            }
        } catch (error) { console.warn("Firebase init failed."); }

        async function saveScore(playerName, finalScore, timeTaken, mode) {
            const collectionName = 'leaderboard_ghepcap';
            const newRecord = { name: playerName, score: finalScore, time: timeTaken, timestamp: Date.now() };
            
            if (db) {
                await authPromise; 
                try {
                    const leaderboardRef = collection(db, 'artifacts', appId, 'public', 'data', collectionName);
                    const docRef = await addDoc(leaderboardRef, newRecord);
                    return docRef.id;
                } catch (e) {}
            }
            
            const localKey = 'LeaderboardHDT_all';
            const localLeaderboard = JSON.parse(localStorage.getItem(localKey) || '[]');
            newRecord.id = 'local_' + Date.now() + Math.random().toString(36).substring(2, 7);
            localLeaderboard.push(newRecord);
            localStorage.setItem(localKey, JSON.stringify(localLeaderboard));
            return newRecord.id;
        }

        async function fetchLeaderboardAndRank(currentDocId, mode) {
            const collectionName = 'leaderboard_ghepcap';
            let records = [];
            
            if (db) {
                await authPromise; 
                try {
                    const leaderboardRef = collection(db, 'artifacts', appId, 'public', 'data', collectionName);
                    const snapshot = await getDocs(leaderboardRef);
                    snapshot.forEach(doc => records.push({ id: doc.id, ...doc.data() }));
                } catch (e) {}
            }
            
            if (records.length === 0) {
                const localKey = 'LeaderboardHDT_all';
                records = JSON.parse(localStorage.getItem(localKey) || '[]');
            }
            
            records.sort((a, b) => { if (b.score !== a.score) return b.score - a.score; return a.time - b.time; });
            let playerRank = null;
            if (currentDocId) { 
                const rankIndex = records.findIndex(r => r.id === currentDocId); 
                if (rankIndex !== -1) playerRank = rankIndex + 1; 
            }
            return { top10: records.slice(0, 10), playerRank };
        }

        window.savePlayerName = function(val) {
            try { localStorage.setItem('PlayerName', val.trim()); } catch(e) {}
        };

// showOverlay attached below

        window.startLevel = function() {
            const nameInput = document.getElementById('playerNameInput');
            if (nameInput) { try { localStorage.setItem('PlayerName', nameInput.value.trim() || 'Người chơi'); } catch(e) {} }
            currentMode = 'all'; lives = 3; loadLevelLogic('all');
        };

        window.changeLeaderboardTab = async function(modeToLoad, currentDocId = null) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeBtn = document.getElementById(`tab-${modeToLoad}`);
            if(activeBtn) activeBtn.classList.add('active');

            const lbContainer = document.getElementById('leaderboard-container');
            lbContainer.innerHTML = `<div class="w-8 h-8 border-4 border-[#14B8A6] border-t-transparent rounded-full animate-spin mx-auto mt-6"></div>`;
            
            const { top10: records, playerRank } = await fetchLeaderboardAndRank(currentDocId, modeToLoad);
            
            const rankBadge = document.getElementById('player-rank-badge');
            if (playerRank && currentMode == modeToLoad) { 
                rankBadge.innerHTML = `<span class="text-[#14B8A6]">#</span>${playerRank}`;
                rankBadge.classList.remove('hidden');
            } else {
                rankBadge.classList.add('hidden');
            }

            if (records.length === 0) {
                lbContainer.innerHTML = `<p class="text-center text-sm text-slate-900 font-medium w-full py-6">Chưa có dữ liệu hệ thống.</p>`;
            } else {
                let tableHTML = `<table class="w-full text-xs sm:text-sm text-slate-900"> <thead class="text-[#2563EB] border-b border-slate-200 font-poppins"> <tr> <th class="pb-3 text-left w-12 font-semibold tracking-wide">Rank</th> <th class="pb-3 text-left font-semibold tracking-wide">Player</th> <th class="pb-3 text-center w-16 font-semibold tracking-wide">Score</th> <th class="pb-3 text-right w-16 font-semibold tracking-wide">Time</th> </tr> </thead> <tbody class="font-medium">`;
                records.forEach((r, idx) => {
                    let rankMoji = `<span class="inline-flex items-center justify-center w-6 h-6 rounded-md bg-slate-100 text-slate-800 font-bold text-xs">${idx + 1}</span>`;
                    if (idx === 0) rankMoji = '<span class="text-xl">🥇</span>'; 
                    if (idx === 1) rankMoji = '<span class="text-xl">🥈</span>'; 
                    if (idx === 2) rankMoji = '<span class="text-xl">🥉</span>';
                    const isCurrent = r.id === currentDocId;
                    const rowClass = isCurrent ? "bg-[#14B8A6]/10 rounded-lg shadow-sm border border-[#14B8A6]/30" : "border-b border-slate-200 hover:bg-slate-100";
                    tableHTML += `<tr class="${rowClass} transition-colors"> <td class="py-3 px-2 text-left">${rankMoji}</td> <td class="py-3 px-2 font-semibold truncate max-w-[100px] sm:max-w-[150px] text-[#2563EB]">${r.name || 'Anonymous'}</td> <td class="py-3 px-2 font-poppins font-bold text-[#14B8A6] text-center">${r.score}</td> <td class="py-3 px-2 font-mono text-slate-900 text-right">${r.time}s</td> </tr>`;
                });
                tableHTML += `</tbody></table>`;
                lbContainer.innerHTML = tableHTML;
            }
        };

        function loadLevelLogic(levelNum) {
            gameState = 'playing';
            firstCard = null; 
            matchedIds = [];
            score = 0; 
            isAnimating = false;
            
            const levelData = { pairs: Object.values(GAME_LEVELS).flatMap(level => level.pairs), time: 480 };
            currentPairs = levelData.pairs;
            timeLeft = levelData.time;

            levelBadge.innerHTML = `<svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg> Đi tìm mảnh ghép`;
            levelBadge.classList.remove('hidden');

            livesContainer.innerHTML = '';
            for (let i = 0; i < 3; i++) {
                const heart = document.createElement('span');
                heart.innerHTML = svgHeart;
                heart.id = `heart-${i}`;
                heart.className = i < lives ? 'heart-active transition-all duration-500 ease-out inline-block' : 'heart-lost transition-all duration-500 ease-out inline-block';
                livesContainer.appendChild(heart);
            }

            updateHeader();
            overlay.classList.add('hidden'); 
            document.getElementById('transition-overlay').classList.add('hidden');
            headerPanel.classList.remove('hidden'); 
            gameBoard.classList.remove('hidden');
            
            renderAndSetupPhysics();

            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                timeLeft--;
                updateHeader();
                if (timeLeft <= 0) endGame('gameover');
            }, 1000);
        }

        function updateHeader() {
            for (let i = 0; i < 3; i++) {
                const heart = document.getElementById(`heart-${i}`);
                if (heart) {
                    if (i < lives) { heart.className = 'heart-active transition-all duration-500 ease-out inline-block'; } 
                    else { heart.className = 'heart-lost transition-all duration-500 ease-out inline-block'; }
                }
            }
            scoreDisplay.innerText = `${score} / ${currentPairs.length}`;
            timerDisplay.innerText = `${timeLeft}s`;

            if (timeLeft <= 10) { 
                timerContainer.className = "flex items-center gap-2 bg-red-100 border border-red-300 px-4 py-1.5 sm:px-5 sm:py-2 rounded-xl font-poppins font-bold text-base sm:text-xl text-red-600 shadow-sm animate-pulse"; 
            } else { 
                timerContainer.className = "flex items-center gap-2 bg-white/85 border border-slate-200 px-4 py-1.5 sm:px-5 sm:py-2 rounded-xl font-poppins font-bold text-base sm:text-xl text-[#14B8A6] shadow-sm transition-colors"; 
            }
        }

        function processCampaignVictory() {
            endGame('victory');
        }

        function endGame(state) {
            if (gameState !== 'playing') return; 
            gameState = state; 
            clearInterval(timerInterval); 
            cancelAnimationFrame(animationFrameId);

            setTimeout(() => {
                overlay.classList.remove('hidden'); 
                headerPanel.classList.add('hidden'); 
                gameBoard.classList.add('hidden');
                showLeaderboardOverlay(state);
            }, 600);
        }

                    <h2 class="text-sm sm:text-base font-medium text-[#2563EB]/70 mb-6 tracking-widest">Tìm cặp biểu thức và kết quả tương ứng để ghép với nhau</h2>

                    <div class="mb-6 text-left glass-card-inner p-4 sm:p-5 rounded-2xl">

                        <input type="text" id="playerNameInput" oninput="window.savePlayerName(this.value)" placeholder="Nhập tên của bạn..." class="w-full px-4 py-3 sm:py-4 rounded-xl bg-white border border-slate-300 focus:outline-none focus:border-[#14B8A6] text-slate-800 font-bold shadow-sm transition-all placeholder-slate-500" value="${savedName}">

                    <button onclick="window.startLevel('all')" class="w-full bg-gradient-to-r from-[#2563EB] to-[#14B8A6] hover:shadow-[0_8px_25px_rgba(255,112,191,0.4)] text-white font-poppins font-bold py-3 sm:py-4 px-8 rounded-xl text-lg sm:text-xl transition-all duration-300 active:scale-95 flex justify-center items-center gap-3 border border-white/20">
                        <svg class="w-6 h-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" /><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
                        Khởi Động
                    </button>
                </div>
            `;
        }

        async function showLeaderboardOverlay(type) {
            let finalScore = score;
            let finalTime = 480 - timeLeft;

            let playerName = "Người chơi";
            try { playerName = localStorage.getItem('PlayerName') || "Người chơi"; } catch(e) {}
            
            const isVictory = type === 'victory';
            const titleIconPath = isVictory

                : 'M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z';
            
            const titleColor = isVictory ? 'text-emerald-600' : 'text-red-600';
            const titleText = isVictory ? 'HOÀN THÀNH XUẤT SẮC' : 'CHƯA VƯỢT QUA';
            const subText = isVictory ? 'Bạn đã làm chủ kiến thức bài học.' : (lives <= 0 ? "Bạn đã chọn sai quá 3 lần." : "Đã hết thời gian kết nối.");
            
            const btnClass = "flex-1 bg-gradient-to-r from-[#2563EB] to-[#14B8A6] hover:shadow-[0_4px_20px_rgba(255,112,191,0.4)] text-white font-poppins font-bold py-3 sm:py-4 px-6 rounded-xl text-sm sm:text-lg transition-all duration-300 active:scale-95 flex justify-center items-center gap-2 border border-white/20";
            let buttonStyle = btnClass;

            overlayContent.innerHTML = `
                <div class="overflow-y-auto custom-scrollbar pr-2">
                    <div class="flex justify-center mb-4">
                        <svg class="w-20 h-20 ${titleColor} ${isVictory ? 'animate-pulse' : 'animate-shake'}" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="${titleIconPath}" />
                        </svg>
                    </div>
                    <h1 class="text-2xl sm:text-3xl font-poppins font-black ${titleColor} mb-2 tracking-wider">${titleText}</h1>
                    <p class="text-slate-800 mb-6 font-medium text-sm sm:text-base">${subText}</p>
                    
                    <div class="glass-card-inner rounded-2xl p-4 mb-6 flex divide-x divide-slate-200 shadow-sm">
                        <div class="flex-1 text-center"> 
                            <p class="text-[10px] sm:text-xs font-semibold text-slate-900 uppercase tracking-widest mb-1">Điểm số</p> 
                            <p class="text-2xl sm:text-3xl font-poppins font-black text-[#14B8A6]">${finalScore} <span class="text-base text-amber-500">⭐</span></p> 
                        </div>
                        <div class="flex-1 text-center"> 
                            <p class="text-[10px] sm:text-xs font-semibold text-slate-900 uppercase tracking-widest mb-1">Thời gian</p> 
                            <p class="text-2xl sm:text-3xl font-poppins font-black text-[#2563EB]">${finalTime}<span class="text-lg text-[#2563EB]/60">s</span></p> 
                        </div>
                    </div>

                    <div class="text-left w-full border-t border-slate-200 pt-5 mt-2">
                        <div class="flex justify-between items-center mb-4">
                            <h3 class="font-poppins font-bold text-[#2563EB] flex items-center gap-2 tracking-wide"><svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 7h8m0 0v8m0-8l-8 8-4-4-6 6" /></svg> Bảng Xếp Hạng</h3>
                            <span id="player-rank-badge" class="hidden bg-[#14B8A6]/10 text-[#14B8A6] text-xs font-bold px-3 py-1 rounded-md border border-[#14B8A6]/30 shadow-sm flex items-center gap-1 font-mono"></span>
                        </div>
                        <div id="leaderboard-container" class="bg-white/90 rounded-xl p-1 shadow-inner min-h-[140px] border border-white">
                            </div>
                    </div>
                </div>
                <div class="flex gap-3 mt-6 pt-4 border-t border-slate-200">
                    <button onclick="window.showOverlay('start')" class="px-6 py-3 bg-white hover:bg-slate-50 border border-slate-200 text-slate-900 font-poppins font-semibold rounded-xl text-sm sm:text-base transition-all active:scale-95 flex items-center gap-2 shadow-sm">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6" /></svg>
                    </button>
                    <button onclick="window.startLevel()" class="${buttonStyle}">
                        <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" /></svg>
                        Thử Lại Nhiệm Vụ
                    </button>
                </div>
            `;

            saveScore(playerName, finalScore, finalTime, currentMode).then((currentDocId) => {
                window.lastPlayedDocId = currentDocId;
                window.changeLeaderboardTab('all', currentDocId);
            });

        // --- RENDER & PHYSICS ---
        function applyCardState(element, state, isLeft) {
            element.className = element.dataset.baseClasses;
            if (state === 'matched') { 
                element.classList.add('animate-sparkle', 'pointer-events-none', 'z-50'); 
            } else if (state === 'error') { 
                element.classList.add('animate-sos', 'z-40'); 
            } else if (state === 'selected') { 
                element.classList.add('bg-white', 'border-amber-400', 'text-[#1D4ED8]', 'scale-[1.12]', 'z-30', 'shadow-[0_0_20px_rgba(250,204,21,0.6)]'); 
            } else {
                element.classList.add('z-10', 'hover:scale-[1.03]'); 
                if (isLeft) { 
                    element.classList.add('bg-[#2563EB]', 'border-[#1D4ED8]', 'text-white', 'shadow-[0_8px_20px_rgba(37,99,235,0.28)]', 'hover:shadow-[0_0_24px_rgba(37,99,235,0.45)]'); 
                } else { 
                    element.classList.add('bg-[#F97316]', 'border-[#EA580C]', 'text-white', 'shadow-[0_8px_20px_rgba(249,115,22,0.26)]', 'hover:shadow-[0_0_24px_rgba(249,115,22,0.42)]'); 
                }
            }
        }

        function renderAndSetupPhysics() {
            gameBoard.innerHTML = ''; movingCards = []; let allItems = [];
            currentPairs.forEach(pair => { allItems.push({ id: pair.id, isLeft: true, content: pair.left }); allItems.push({ id: pair.id, isLeft: false, content: pair.right }); });
            allItems.sort(() => Math.random() - 0.5);

            const iconLeft = `<svg class="w-4 h-4 text-white opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>`;
            const iconRight = `<svg class="w-4 h-4 text-white opacity-80" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" /></svg>`;

            allItems.forEach(item => {
                const el = document.createElement('div');
                const baseClasses = `game-card font-bold border-[2px] rounded-2xl transition-all`;
                el.dataset.baseClasses = baseClasses; el.dataset.id = item.id; el.dataset.side = item.isLeft ? 'left' : 'right';
                
                const icon = item.isLeft ? iconLeft : iconRight; 
                
				el.innerHTML = `<div class="flex items-center gap-2 pointer-events-none">${icon}<span class="math-content drop-shadow-sm">${item.content}</span></div>`;                
                applyCardState(el, 'idle', item.isLeft);
                el.addEventListener('click', () => handleSelect(item.isLeft, item.id, el));
                el.style.opacity = "0"; 
                gameBoard.appendChild(el);

                movingCards.push({ id: item.id, isLeft: item.isLeft, el: el, active: true, x: 0, y: 0, vx: 0, vy: 0, width: 0, height: 0, baseSpeed: 0 });
            });

            const setupPositions = () => {
                const boardRect = gameBoard.getBoundingClientRect();
                movingCards.forEach(c => {
                    c.width = c.el.offsetWidth; c.height = c.el.offsetHeight;
                    c.x = Math.random() * (boardRect.width - c.width); c.y = Math.random() * (boardRect.height - c.height);
                    const speed = 0.6 + Math.random() * 0.9; c.baseSpeed = speed; 
                    const angle = Math.random() * 2 * Math.PI; c.vx = Math.cos(angle) * speed; c.vy = Math.sin(angle) * speed;
                    c.el.style.left = `${c.x}px`; c.el.style.top = `${c.y}px`; c.el.style.opacity = "1"; 
                });
                gameLoop(); 
            };

            if (window.MathJax) {
                MathJax.typesetPromise([gameBoard]).then(() => {
                    setupPositions();
                }).catch((err) => {
                    console.log('MathJax error:', err.message);
                    setupPositions(); 
                });
            } else {
                setTimeout(setupPositions, 300);
            }
        }

        function gameLoop() {
            if (gameState !== 'playing') return;
            const boardRect = gameBoard.getBoundingClientRect();
            const boardW = boardRect.width; const boardH = boardRect.height;

            movingCards.forEach(c => {
                if (!c.active) return; 
                const currentSpeed = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
                if (currentSpeed > c.baseSpeed) {
                    c.vx *= 0.95; c.vy *= 0.95; 
                    const newSpeed = Math.sqrt(c.vx * c.vx + c.vy * c.vy);
                    if (newSpeed <= c.baseSpeed && newSpeed > 0) { const angle = Math.atan2(c.vy, c.vx); c.vx = Math.cos(angle) * c.baseSpeed; c.vy = Math.sin(angle) * c.baseSpeed; }
                }
                c.x += c.vx; c.y += c.vy;
                if (c.x <= 0) { c.x = 0; c.vx = Math.abs(c.vx); }
                if (c.x + c.width >= boardW) { c.x = boardW - c.width; c.vx = -Math.abs(c.vx); }
                if (c.y <= 0) { c.y = 0; c.vy = Math.abs(c.vy); }
                if (c.y + c.height >= boardH) { c.y = boardH - c.height; c.vy = -Math.abs(c.vy); }
                c.el.style.left = `${c.x}px`; c.el.style.top = `${c.y}px`;
            });
            animationFrameId = requestAnimationFrame(gameLoop);
        }

        function handleSelect(isLeft, id, element) {
            if (gameState !== 'playing' || isAnimating || matchedIds.includes(id)) return;

            if (firstCard && firstCard.id === id && firstCard.isLeft === isLeft) { applyCardState(element, 'idle', isLeft); firstCard = null; return; }
            if (!firstCard) { firstCard = { id, isLeft, el: element }; applyCardState(element, 'selected', isLeft); return; }
            
            const secondCard = { id, isLeft, el: element };
            applyCardState(element, 'selected', isLeft);
            checkMatch(firstCard, secondCard);
        }

        function createHaloEffect(x, y) {
            const halo = document.createElement('div'); halo.className = 'halo-effect'; halo.style.left = `${x}px`; halo.style.top = `${y}px`;
            const ring1 = document.createElement('div'); ring1.className = 'halo-ring';
            const ring2 = document.createElement('div'); ring2.className = 'halo-ring'; ring2.style.animationDelay = '0.1s'; ring2.style.borderColor = '#2563EB';
            const icon = document.createElement('div'); icon.className = 'halo-icon'; 
            icon.innerHTML = `<svg class="w-16 h-16" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M13 10V3L4 14h7v7l9-11h-7z" /></svg>`;
            halo.appendChild(ring1); halo.appendChild(ring2); halo.appendChild(icon);
            document.getElementById('game-board').appendChild(halo);
            setTimeout(() => { if (halo.parentNode) halo.parentNode.removeChild(halo); }, 1000);
        }

        function checkMatch(c1, c2) {
            isAnimating = true; 
            const isMatch = (c1.id === c2.id) && (c1.isLeft !== c2.isLeft); 
            
            if (isMatch) {
                matchedIds.push(c1.id); score++; updateHeader();
                sndMatch.currentTime = 0; sndMatch.play().catch(e => {});

                const physC1 = movingCards.find(c => c.id === c1.id && c.isLeft === c1.isLeft);
                const physC2 = movingCards.find(c => c.id === c2.id && c.isLeft === c2.isLeft);
                
                if(physC1 && physC2) {
                    physC1.active = false; physC2.active = false;
                    const midX = (physC1.x + physC1.width/2 + physC2.x + physC2.width/2) / 2; const midY = (physC1.y + physC1.height/2 + physC2.y + physC2.height/2) / 2;

                    c1.el.classList.add('merge-transition'); c2.el.classList.add('merge-transition');
                    c1.el.style.left = `${midX - physC1.width/2}px`; c1.el.style.top = `${midY - physC1.height/2}px`;
                    c2.el.style.left = `${midX - physC2.width/2}px`; c2.el.style.top = `${midY - physC2.height/2}px`;

                    setTimeout(() => {
                        createHaloEffect(midX, midY);
                        c1.el.style.transform = 'scale(0)'; c2.el.style.transform = 'scale(0)';
                        setTimeout(() => { applyCardState(c1.el, 'matched', c1.isLeft); applyCardState(c2.el, 'matched', c2.isLeft); }, 200);
                        
                        if (matchedIds.length === currentPairs.length) {
                            if (currentMode === 'campaign') {
                                setTimeout(processCampaignVictory, 800);
                            } else {
                                setTimeout(() => endGame('victory'), 800);
                            }
                        } else { firstCard = null; isAnimating = false;  }
                    }, 250);
                }
            } else {
                lives--; updateHeader();
                sndError.currentTime = 0; sndError.play().catch(e => {});

                applyCardState(c1.el, 'error', c1.isLeft); applyCardState(c2.el, 'error', c2.isLeft);

                const physC1 = movingCards.find(c => c.id === c1.id && c.isLeft === c1.isLeft);
                const physC2 = movingCards.find(c => c.id === c2.id && c.isLeft === c2.isLeft);
                
                if (physC1 && physC2) {
                    const cx1 = physC1.x + physC1.width/2; const cy1 = physC1.y + physC1.height/2;
                    const cx2 = physC2.x + physC2.width/2; const cy2 = physC2.y + physC2.height/2;
                    let dx = cx1 - cx2; let dy = cy1 - cy2;
                    let dist = Math.sqrt(dx*dx + dy*dy); if (dist === 0) { dx = 1; dy = 0; dist = 1; } 
                    
                    const repelForce = 50; 
                    physC1.vx = (dx / dist) * repelForce; physC1.vy = (dy / dist) * repelForce;
                    physC2.vx = -(dx / dist) * repelForce; physC2.vy = -(dy / dist) * repelForce;
                }

                if (lives <= 0) {
                    setTimeout(() => {
                        applyCardState(c1.el, 'idle', c1.isLeft); applyCardState(c2.el, 'idle', c2.isLeft);
                        endGame('gameover');
                    }, 600); 
                } else {
                    setTimeout(() => {
                        applyCardState(c1.el, 'idle', c1.isLeft); applyCardState(c2.el, 'idle', c2.isLeft);
                        firstCard = null; isAnimating = false;
                    }, 800);
                }
            }
        }

        showOverlay('start');
    </script>
