<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chinh phục Toán 12</title>
<style>
:root{--bg:#eaf1ff;--card:#fff;--ink:#14213d;--muted:#5b6785;--pri:#1d4ed8;--gold:#f5b700;--ok:#16a34a;--okbg:#dcfce7;--bad:#dc2626;--badbg:#fee2e2;--line:#d6e0f5;--fs:17px;--c:#1d4ed8}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:var(--fs);line-height:1.5;min-height:100vh}
body.big{--fs:23px}
button{font:inherit;cursor:pointer;border:0;color:inherit}
.wrap{max-width:1100px;margin:0 auto;padding:16px}
/* ---- toán ---- */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.92em;margin:0 2px;line-height:1.15}
.fr>i{font-style:normal;padding:0 3px}
.fr>i:first-child{border-bottom:1.5px solid currentColor}
.ov{border-top:1.5px solid currentColor;padding-top:1px;margin-left:1px}
.vec{display:inline-block;position:relative;padding-top:.2em;line-height:1.1}
.vec::before{content:"";position:absolute;left:1px;right:2px;top:.08em;border-top:1.5px solid currentColor}
.vec::after{content:"";position:absolute;right:-2px;top:calc(.08em - 3.2px);border-left:6px solid currentColor;border-top:4px solid transparent;border-bottom:4px solid transparent}
.st{display:inline-flex;flex-direction:column;font-size:.72em;line-height:1.05;vertical-align:middle;margin-left:1px}
.st sup,.st sub{font-size:1em;vertical-align:baseline;line-height:1.05}
.he{display:inline-flex;flex-direction:column;vertical-align:middle;border-left:2.5px solid currentColor;border-radius:10px 0 0 10px;padding:0 4px 0 8px;margin:2px 4px;line-height:1.35}
.bang{border-collapse:collapse;margin:8px 0;font-size:.95em}
.bang td,.bang th{border:1.5px solid var(--line);padding:3px 10px;text-align:center}
.bang th{background:#f1f5ff}
/* ---- trang chủ ---- */
.hero{background:linear-gradient(135deg,#1e3a8a,#2563eb 55%,#0ea5e9);color:#fff;border-radius:28px;padding:34px 26px;text-align:center;position:relative;overflow:hidden;box-shadow:0 18px 40px -18px #1e3a8a}
.hero::after{content:"∑  π  √  ∞  △  ∫  θ  ≥";position:absolute;inset:auto 0 -10px 0;font-size:60px;opacity:.08;letter-spacing:22px;white-space:nowrap}
.hero h1{margin:6px 0 4px;font-size:clamp(30px,6vw,54px);line-height:1.1;letter-spacing:.5px}
.hero h1 b{color:var(--gold)}
.hero p{margin:6px 0 0;opacity:.92}
.logo{font-size:56px;filter:drop-shadow(0 6px 10px #0005)}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;margin:20px 0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:14px;font-weight:700;background:var(--pri);color:#fff;box-shadow:0 4px 0 #1e3a8a;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #1e3a8a}
.btn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 4px 0 #b88900}
.btn.white{background:#fff;color:var(--ink);box-shadow:0 4px 0 #c5d2ee}
.btn.ok{background:var(--ok);box-shadow:0 4px 0 #0f6b30}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.big-btn{padding:20px;font-size:1.12em;border-radius:20px;flex-direction:column}
.big-btn small{font-weight:500;opacity:.85;font-size:.78em}
.types{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px}
.type{background:#fff;border-radius:16px;padding:12px 14px;border:2px solid var(--line)}
.type b{display:block}
.type span{color:var(--muted);font-size:.85em}
.note{color:var(--muted);font-size:.85em;text-align:center;margin-top:18px}
.draft{display:inline-block;background:#fff7d6;border:1.5px dashed #e0b100;color:#6b5200;border-radius:10px;padding:4px 10px;font-size:.85em}
h2.sec{margin:26px 0 10px;font-size:1.15em}
/* ---- bản đồ ---- */
.mapbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between;background:#fff;border-radius:18px;padding:12px 16px;box-shadow:0 6px 18px -12px #1e3a8a;position:sticky;top:8px;z-index:5}
.rank{display:flex;align-items:center;gap:10px;font-weight:700}
.rank .ic{font-size:32px}
.rank small{display:block;font-weight:500;color:var(--muted);font-size:.78em}
.pill{background:#f1f5ff;border-radius:999px;padding:6px 12px;font-weight:700}
.lands{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-top:16px}
.land{background:#fff;border-radius:22px;overflow:hidden;box-shadow:0 10px 24px -18px #1e3a8a;border:2px solid transparent}
.land .hd{background:linear-gradient(135deg,var(--c),color-mix(in srgb,var(--c) 60%,#fff));color:#fff;padding:14px 16px;display:flex;gap:12px;align-items:center}
.land .hd .ic{font-size:38px}
.land .hd b{display:block;font-size:1.08em}
.land .hd small{opacity:.95}
.land .hd .cnt{margin-left:auto;background:#fff3;border-radius:999px;padding:3px 10px;font-weight:700;white-space:nowrap}
.path{display:flex;flex-wrap:wrap;gap:14px 10px;padding:16px;align-items:flex-start}
.node{display:flex;flex-direction:column;align-items:center;width:78px;text-align:center;background:none;padding:0}
.node .ci{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:1.15em;background:#fff;border:3px solid var(--c);color:var(--c);box-shadow:0 4px 0 color-mix(in srgb,var(--c) 55%,#000);transition:transform .1s}
.node:hover .ci{transform:translateY(-2px)}
.node.done .ci{background:var(--c);color:#fff}
.node.lock{cursor:not-allowed}
.node.lock .ci{border-color:#c4cbe0;color:#9aa3bd;background:#eef1f8;box-shadow:0 4px 0 #c4cbe0}
.node.next .ci{animation:pulse 1.4s infinite}
.node.boss .ci{border-radius:16px;background:#1f2937;color:var(--gold);border-color:var(--gold);box-shadow:0 4px 0 #000}
.node.boss.lock .ci{background:#eef1f8;color:#9aa3bd;border-color:#c4cbe0}
.node .nm{font-size:.7em;line-height:1.2;margin-top:6px;color:var(--muted);max-height:2.5em;overflow:hidden}
.node .sv{font-size:.75em;letter-spacing:-1px;height:1.2em}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--c) 50%,transparent),0 4px 0 color-mix(in srgb,var(--c) 55%,#000)}50%{box-shadow:0 0 0 10px transparent,0 4px 0 color-mix(in srgb,var(--c) 55%,#000)}}
/* ---- modal ---- */
.ov-bg{position:fixed;inset:0;background:#0f172acc;display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}
.modal{background:#fff;border-radius:24px;max-width:560px;width:100%;padding:22px;max-height:92vh;overflow:auto;box-shadow:0 30px 60px -20px #000}
.modal h3{margin:0 0 6px;font-size:1.3em}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.chip{background:#f1f5ff;border-radius:999px;padding:4px 10px;font-size:.85em}
.tg{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.tg input{width:22px;height:22px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bd{border:2px solid var(--line);border-radius:16px;padding:10px;text-align:center}
.bd .e{font-size:34px}
.bd.off{opacity:.35;filter:grayscale(1)}
.bd b{display:block;font-size:.9em}
.bd span{font-size:.75em;color:var(--muted)}
@keyframes fade{from{opacity:0}}
/* ---- màn chơi ---- */
.play{max-width:860px;margin:0 auto;padding:12px 16px 40px}
.topbar{display:flex;align-items:center;gap:10px}
.ghost{background:#fff;border-radius:12px;width:42px;height:42px;font-size:20px;box-shadow:0 3px 0 #c5d2ee;flex:none}
.ttl{font-weight:800;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hearts{font-size:1.25em;letter-spacing:2px;white-space:nowrap}
.hearts .lost{animation:shake .5s}
.prog{height:12px;background:#d8e2f7;border-radius:999px;margin:12px 0 8px;overflow:hidden}
.prog>div{height:100%;background:linear-gradient(90deg,var(--c),var(--gold));border-radius:999px;transition:width .4s}
.stat{display:flex;gap:10px;flex-wrap:wrap;align-items:center;font-weight:700;color:var(--muted);font-size:.9em}
.stat .sc{margin-left:auto;color:var(--ink)}
.combo{opacity:.35}
.combo.on{opacity:1;color:#ea580c;animation:pop .3s}
.timer{display:inline-flex;align-items:center;gap:6px}
.tbar{width:90px;height:8px;background:#d8e2f7;border-radius:9px;overflow:hidden}
.tbar>div{height:100%;background:var(--ok);transition:width .25s linear}
.qcard{background:#fff;border-radius:24px;padding:20px 20px 16px;margin-top:12px;box-shadow:0 14px 30px -20px #1e3a8a;border-top:6px solid var(--c);animation:slide .3s}
.qcard.boss{border:3px solid var(--gold);border-top-width:8px;background:linear-gradient(#fff,#fffaf0)}
.tag{display:inline-block;background:color-mix(in srgb,var(--c) 12%,#fff);color:var(--c);font-weight:800;border-radius:999px;padding:3px 12px;font-size:.8em;letter-spacing:.3px}
.qcard.boss .tag{background:#1f2937;color:var(--gold)}
.q{font-size:1.12em;margin:12px 0 14px;font-weight:600}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:10px}
.opt{display:flex;align-items:center;gap:12px;text-align:left;background:#f6f8ff;border:2.5px solid var(--line);border-radius:16px;padding:10px 14px;min-height:56px;transition:transform .08s,border-color .15s}
.opt:hover:not([disabled]){border-color:var(--c);transform:translateY(-1px)}
.opt .lt{flex:none;width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:var(--c);color:#fff;font-weight:800}
.opt.ok{border-color:var(--ok);background:var(--okbg)}
.opt.ok .lt{background:var(--ok)}
.opt.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.opt.bad .lt{background:var(--bad)}
.opt.gone{visibility:hidden}
.opt[disabled]{cursor:default}
.tf{display:flex;flex-direction:column;gap:8px}
.tfr{display:flex;gap:10px;align-items:center;background:#f6f8ff;border:2px solid var(--line);border-radius:14px;padding:8px 10px}
.tfr .tx{flex:1}
.tfr .lb{font-weight:800;color:var(--c);flex:none}
.tfb{display:flex;gap:6px;flex:none}
.tfb button{width:46px;height:40px;border-radius:10px;background:#fff;border:2px solid var(--line);font-weight:800}
.tfb button.on.d{background:#2563eb;color:#fff;border-color:#2563eb}
.tfb button.on.s{background:#7c3aed;color:#fff;border-color:#7c3aed}
.tfr.ok{border-color:var(--ok);background:var(--okbg)}
.tfr.bad{border-color:var(--bad);background:var(--badbg)}
.tfr .kq{font-size:.8em;font-weight:700;flex:none}
.inp{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.inp input{flex:1;min-width:180px;font:inherit;font-size:1.2em;padding:10px 14px;border-radius:14px;border:2.5px solid var(--line);outline:none}
.inp input:focus{border-color:var(--c)}
.inp input.ok{border-color:var(--ok);background:var(--okbg)}
.inp input.bad{border-color:var(--bad);background:var(--badbg)}
.hint-in{color:var(--muted);font-size:.8em;margin-top:6px}
.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mt .col{display:flex;flex-direction:column;gap:8px}
.mi{background:#f6f8ff;border:2.5px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left;min-height:48px}
.mi.sel{border-color:var(--c);background:color-mix(in srgb,var(--c) 12%,#fff)}
.mi.bad{border-color:var(--bad);background:var(--badbg);animation:shake .4s}
.mi.done{color:#fff;cursor:default}
.ordz{display:flex;flex-direction:column;gap:8px}
.ordz .lbl{font-size:.8em;font-weight:700;color:var(--muted);margin-top:4px}
.oi{display:flex;gap:10px;align-items:center;background:#f6f8ff;border:2.5px solid var(--line);border-radius:14px;padding:9px 12px;text-align:left}
.oi .n{flex:none;width:28px;height:28px;border-radius:50%;background:var(--c);color:#fff;font-weight:800;display:grid;place-items:center;font-size:.85em}
.oi.empty{border-style:dashed;color:#9aa3bd;justify-content:center;cursor:default}
.oi.ok{border-color:var(--ok);background:var(--okbg)}
.oi.bad{border-color:var(--bad);background:var(--badbg)}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;align-items:center}
.pw{background:#fff;border:2px solid var(--line);border-radius:12px;padding:6px 12px;font-weight:700;font-size:.85em}
.pw[disabled]{opacity:.35;cursor:not-allowed}
.tools .sp{flex:1}
.hintbox{background:#fffbea;border:2px dashed #f5c400;border-radius:14px;padding:8px 12px;margin-top:10px;animation:slide .25s}
.fb{margin-top:14px;border-radius:20px;padding:16px 18px;animation:slide .25s;border:2.5px solid}
.fb.ok{background:var(--okbg);border-color:#86efac}
.fb.bad{background:var(--badbg);border-color:#fca5a5}
.fb.mid{background:#fef3c7;border-color:#fcd34d}
.fb h4{margin:0 0 6px;font-size:1.2em}
.fb .ex{background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0 12px}
.fb .ex b.k{color:var(--c)}
@keyframes shake{0%,100%{transform:none}20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
@keyframes pop{0%{transform:scale(1)}50%{transform:scale(1.35)}100%{transform:scale(1)}}
@keyframes slide{from{opacity:0;transform:translateY(10px)}}
/* ---- kết quả ---- */
.res{max-width:620px;margin:20px auto;background:#fff;border-radius:28px;padding:26px;text-align:center;box-shadow:0 20px 40px -24px #1e3a8a;border-top:8px solid var(--c)}
.stars{font-size:62px;letter-spacing:6px;margin:6px 0}
.stars span{display:inline-block;animation:popin .5s both}
.stars span.off{filter:grayscale(1);opacity:.25}
@keyframes popin{from{transform:scale(0) rotate(-40deg)}}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.kpi{background:#f6f8ff;border-radius:16px;padding:10px}
.kpi b{display:block;font-size:1.4em}
.kpi span{font-size:.8em;color:var(--muted)}
.newb{background:#fffbea;border:2px solid #fde68a;border-radius:16px;padding:10px;margin:10px 0;animation:pop .5s}
canvas#cf{position:fixed;inset:0;pointer-events:none;z-index:99}
@media (max-width:560px){
 .wrap,.play{padding:10px}
 .mt{gap:6px} .mt .col{gap:6px} .mi{font-size:.88em;padding:7px 8px}
 .tfr{flex-wrap:wrap}
 .tfr .tx{flex-basis:calc(100% - 40px)}
 .tfb{margin-left:auto}
 .kpis{grid-template-columns:1fr 1fr 1fr}
 .node{width:68px}
 .node .ci{width:50px;height:50px}
 .hero{padding:26px 16px}
}
</style>
</head>
<body>
<div id="app"></div>
<canvas id="cf"></canvas>
<script>
/* ===== Ký hiệu toán (không cần mạng) ===== */
const f=(a,b)=>`<span class="fr"><i>${a}</i><i>${b}</i></span>`;
const r=x=>`√<span class="ov">${x}</span>`;
const v=x=>`<span class="vec">${x}</span>`;
const C=(n,k)=>`C<span class="st"><sup>${k}</sup><sub>${n}</sub></span>`;
const A=(n,k)=>`A<span class="st"><sup>${k}</sup><sub>${n}</sub></span>`;
const he=(...a)=>`<span class="he">${a.map(x=>`<span>${x}</span>`).join('')}</span>`;
const R='ℝ',N='ℕ',Z='ℤ',Q='ℚ';
const lim=x=>`lim<sub>${x}</sub>`;
const lg=a=>`log<sub>${a}</sub>`;
const sd='sđ';

/* ===== 6 vùng đất = 6 chương ===== */
const CH=[
 {id:1,so:'I',ten:'Ứng dụng đạo hàm để khảo sát và vẽ đồ thị hàm số',vung:'Dãy núi Đồ thị',ic:'⛰️',mau:'#0f9d8f'},
 {id:2,so:'II',ten:'Vectơ và hệ trục toạ độ trong không gian',vung:'Cảng Vectơ',ic:'🧭',mau:'#2563eb'},
 {id:3,so:'III',ten:'Các số đặc trưng đo mức độ phân tán của mẫu số liệu ghép nhóm',vung:'Thành phố Phân tán',ic:'🏙️',mau:'#ea580c'},
 {id:4,so:'IV',ten:'Nguyên hàm và tích phân',vung:'Thung lũng Tích phân',ic:'🏞️',mau:'#9333ea'},
 {id:5,so:'V',ten:'Phương pháp toạ độ trong không gian',vung:'Trạm vũ trụ Oxyz',ic:'🛰️',mau:'#0284c7'},
 {id:6,so:'VI',ten:'Xác suất có điều kiện',vung:'Lâu đài Bayes',ic:'🏰',mau:'#db2777'}
];
const BAI=[];
function bai(so,ch,ten,cau){BAI.push({so,ch,ten,cau})}

/* CHƯƠNG I. ỨNG DỤNG ĐẠO HÀM ĐỂ KHẢO SÁT VÀ VẼ ĐỒ THỊ HÀM SỐ */
bai(1,1,'Tính đơn điệu và cực trị của hàm số',[
 {t:'mc',q:'Hàm số <i>y</i> = <i>f</i>(<i>x</i>) có <i>f′</i>(<i>x</i>) &gt; 0 với mọi <i>x</i> thuộc khoảng (<i>a</i>; <i>b</i>). Khẳng định nào đúng?',o:['<i>f</i> đồng biến trên (<i>a</i>; <i>b</i>)','<i>f</i> nghịch biến trên (<i>a</i>; <i>b</i>)','<i>f</i> không đổi trên (<i>a</i>; <i>b</i>)','<i>f</i> có cực trị trên (<i>a</i>; <i>b</i>)'],h:'Dương lên – âm xuống.',e:'<i>f′</i> &gt; 0 trên một khoảng ⇒ hàm số đồng biến trên khoảng đó.'},
 {t:'mc',q:'Hàm số <i>y</i> = <i>x</i>² − 4<i>x</i> + 2 nghịch biến trên khoảng nào?',o:['(−∞; 2)','(2; +∞)','(−∞; −2)','(−2; +∞)'],h:'Xét dấu <i>y′</i> = 2<i>x</i> − 4.',e:'<i>y′</i> = 2<i>x</i> − 4 &lt; 0 ⇔ <i>x</i> &lt; 2.'},
 {t:'in',q:'Tìm giá trị cực đại của hàm số <i>y</i> = <i>x</i>³ − 6<i>x</i>² + 9<i>x</i> + 30.',a:[34],h:'<i>y′</i> = 3<i>x</i>² − 12<i>x</i> + 9.',e:'<i>y′</i> = 0 ⇔ <i>x</i> = 1 hoặc <i>x</i> = 3; <i>y′</i> đổi dấu từ + sang − tại <i>x</i> = 1 ⇒ <i>y</i><sub>CĐ</sub> = <i>y</i>(1) = 34.'},
 {t:'in',q:'Hàm số <i>y</i> = <i>x</i>³ − 6<i>x</i>² + 9<i>x</i> + 30 đạt cực tiểu tại <i>x</i> bằng bao nhiêu?',a:[3],e:'<i>y′</i> đổi dấu từ − sang + tại <i>x</i> = 3 ⇒ điểm cực tiểu <i>x</i> = 3, <i>y</i><sub>CT</sub> = 30.'},
 {t:'tf',q:'Xét các khẳng định.',s:[['Nếu <i>f′</i>(<i>x</i><sub>0</sub>) = 0 thì <i>x</i><sub>0</sub> chắc chắn là điểm cực trị.',false],['Hàm số <i>y</i> = <i>x</i>³ đồng biến trên ℝ.',true],['<i>f′</i> đổi dấu từ + sang − khi <i>x</i> qua <i>x</i><sub>0</sub> thì <i>x</i><sub>0</sub> là điểm cực đại.',true],['Hàm số <i>y</i> = '+f('<i>x</i> − 2','<i>x</i> + 1')+' đồng biến trên ℝ.',false]],e:'<i>y</i> = <i>x</i>³ có <i>y′</i>(0) = 0 nhưng không có cực trị. Hàm '+f('<i>x</i> − 2','<i>x</i> + 1')+' đồng biến trên từng khoảng (−∞; −1), (−1; +∞), không xác định tại −1.'},
 {t:'order',q:'Sắp xếp các bước xét tính đơn điệu của hàm số.',s:['Tìm tập xác định.','Tính <i>f′</i>(<i>x</i>), tìm các điểm <i>f′</i>(<i>x</i>) = 0 hoặc không tồn tại.','Sắp xếp các điểm đó, lập bảng biến thiên.','Kết luận các khoảng đồng biến, nghịch biến.'],e:'Theo SGK: tập xác định → đạo hàm → bảng biến thiên → kết luận.'},
 {t:'in',q:'Tìm giá trị cực tiểu của hàm số <i>y</i> = '+f('<i>x</i>² − 2<i>x</i> + 9','<i>x</i> − 2')+'.',a:[8],h:'<i>y′</i> = '+f('<i>x</i>² − 4<i>x</i> − 5','(<i>x</i> − 2)²')+'.',e:'<i>y′</i> = 0 ⇔ <i>x</i> = −1 hoặc <i>x</i> = 5; cực tiểu tại <i>x</i> = 5: <i>y</i> = '+f('25 − 10 + 9','3')+' = 8.'},
 {t:'mc',q:'Hàm số <i>y</i> = <i>x</i>⁴ − 2<i>x</i>² có bao nhiêu điểm cực trị?',o:['3','1','2','0'],h:'<i>y′</i> = 4<i>x</i>(<i>x</i>² − 1).',e:'<i>y′</i> đổi dấu tại <i>x</i> = −1, 0, 1 ⇒ 3 điểm cực trị.'},
 {t:'in',b:1,q:'Chất điểm chuyển động theo <i>s</i>(<i>t</i>) = <i>t</i>³ − 9<i>t</i>² + 15<i>t</i>. Nó chuyển động sang trái (<i>v</i> &lt; 0) trong khoảng thời gian (<i>a</i>; <i>b</i>). Tính <i>b</i> − <i>a</i>.',a:[4],h:'<i>v</i>(<i>t</i>) = <i>s′</i>(<i>t</i>).',e:'<i>v</i>(<i>t</i>) = 3<i>t</i>² − 18<i>t</i> + 15 &lt; 0 ⇔ 1 &lt; <i>t</i> &lt; 5 ⇒ <i>b</i> − <i>a</i> = 4.'}
]);
bai(2,1,'Giá trị lớn nhất và giá trị nhỏ nhất của hàm số',[
 {t:'mc',q:'Giá trị lớn nhất của hàm số <i>y</i> = √(1 − <i>x</i>²) là',o:['1','0','2','√2'],e:'0 ≤ 1 − <i>x</i>² ≤ 1 ⇒ 0 ≤ <i>y</i> ≤ 1, <i>y</i> = 1 khi <i>x</i> = 0.'},
 {t:'in',q:'Tìm giá trị lớn nhất của <i>y</i> = <i>x</i>³ − 3<i>x</i> trên đoạn [0; 2].',a:[2],h:'So sánh <i>y</i>(0), <i>y</i>(1), <i>y</i>(2).',e:'<i>y′</i> = 0 ⇔ <i>x</i> = 1 ∈ (0; 2). <i>y</i>(0) = 0, <i>y</i>(1) = −2, <i>y</i>(2) = 2 ⇒ max = 2.'},
 {t:'in',q:'Tìm giá trị nhỏ nhất của <i>y</i> = <i>x</i>³ − 3<i>x</i> trên đoạn [0; 2].',a:[-2],e:'Trong các giá trị 0; −2; 2, nhỏ nhất là −2 (tại <i>x</i> = 1).'},
 {t:'in',q:'Tìm giá trị nhỏ nhất của <i>y</i> = <i>x</i> − 2 + '+f('1','<i>x</i>')+' trên khoảng (0; +∞).',a:[0],e:'<i>y′</i> = 1 − '+f('1','<i>x</i>²')+' = 0 ⇔ <i>x</i> = 1; bảng biến thiên cho min = <i>y</i>(1) = 0.'},
 {t:'tf',q:'Xét các khẳng định.',s:[['Hàm số liên tục trên một đoạn luôn có GTLN và GTNN trên đoạn đó.',true],['Hàm số <i>y</i> = <i>x</i> − 2 + 1/<i>x</i> có GTLN trên (0; +∞).',false],['GTLN của hàm số trên [<i>a</i>; <i>b</i>] có thể đạt tại đầu mút.',true],['Nếu <i>f</i>(<i>x</i>) ≤ 5 với mọi <i>x</i> ∈ <i>D</i> thì chắc chắn max <i>f</i> = 5.',false]],e:'Cần thêm điều kiện có <i>x</i><sub>0</sub> ∈ <i>D</i> để <i>f</i>(<i>x</i><sub>0</sub>) = 5.'},
 {t:'order',q:'Sắp xếp quy tắc tìm GTLN, GTNN của hàm số liên tục trên đoạn [<i>a</i>; <i>b</i>].',s:['Tìm các điểm <i>x<sub>i</sub></i> ∈ (<i>a</i>; <i>b</i>) mà <i>f′</i> = 0 hoặc không tồn tại.','Tính <i>f</i>(<i>x<sub>i</sub></i>), <i>f</i>(<i>a</i>), <i>f</i>(<i>b</i>).','So sánh các giá trị vừa tính.','Kết luận số lớn nhất là <i>M</i>, nhỏ nhất là <i>m</i>.'],e:'Đạo hàm – đầu mút – so sánh.'},
 {t:'in',q:'Tìm giá trị nhỏ nhất của <i>y</i> = <i>x</i>⁴ − 4<i>x</i>² + 3 trên đoạn [0; 4].',a:[-1],h:'<i>y′</i> = 4<i>x</i>³ − 8<i>x</i>.',e:'<i>y′</i> = 0 ⇔ <i>x</i> = 0 hoặc <i>x</i> = √2 (trong đoạn). <i>y</i>(0) = 3, <i>y</i>(√2) = −1, <i>y</i>(4) = 195 ⇒ min = −1.'},
 {t:'mc',q:'Từ tấm bìa vuông cạnh 60 cm, cắt 4 góc là 4 hình vuông cạnh <i>x</i> rồi gấp thành hộp không nắp. Thể tích lớn nhất khi <i>x</i> bằng',o:['10 cm','15 cm','20 cm','5 cm'],h:'<i>V</i> = <i>x</i>(60 − 2<i>x</i>)².',e:'<i>V′</i> = (60 − 2<i>x</i>)(60 − 6<i>x</i>) = 0 ⇒ <i>x</i> = 10; <i>V</i><sub>max</sub> = 16 000 cm³.'},
 {t:'in',b:1,q:'Một vật được ném lên có độ cao <i>h</i>(<i>t</i>) = 2 + 24,5<i>t</i> − 4,9<i>t</i>² (m). Tìm độ cao lớn nhất của vật (m).',a:[32.625],tol:0.001,u:'m',h:'<i>h′</i>(<i>t</i>) = 0.',e:'<i>h′</i> = 24,5 − 9,8<i>t</i> = 0 ⇔ <i>t</i> = 2,5 ⇒ <i>h</i>(2,5) = 32,625 m.'}
]);
bai(3,1,'Đường tiệm cận của đồ thị hàm số',[
 {t:'mc',q:'Tiệm cận ngang của đồ thị <i>y</i> = '+f('3<i>x</i> − 2','<i>x</i> + 1')+' là',o:['<i>y</i> = 3','<i>y</i> = −1','<i>x</i> = −1','<i>y</i> = −2'],e:'lim<sub><i>x</i>→±∞</sub> <i>y</i> = 3.'},
 {t:'mc',q:'Tiệm cận đứng của đồ thị <i>y</i> = '+f('3 − <i>x</i>','<i>x</i> + 2')+' là',o:['<i>x</i> = −2','<i>x</i> = 2','<i>y</i> = −1','<i>x</i> = 3'],e:'Khi <i>x</i> → −2 thì <i>y</i> → ±∞.'},
 {t:'in',q:'Đồ thị <i>y</i> = '+f('2<i>x</i> + 1','<i>x</i> − 1')+' có tiệm cận ngang <i>y</i> = <i>a</i>. Tìm <i>a</i>.',a:[2],e:'Tỉ số hệ số của <i>x</i>: 2/1 = 2.'},
 {t:'mc',q:'Tiệm cận xiên của đồ thị <i>y</i> = '+f('<i>x</i>² − <i>x</i> + 2','<i>x</i> + 1')+' là',o:['<i>y</i> = <i>x</i> − 2','<i>y</i> = <i>x</i> + 1','<i>y</i> = <i>x</i>','<i>y</i> = <i>x</i> + 2'],h:'Chia đa thức.',e:'<i>y</i> = <i>x</i> − 2 + '+f('4','<i>x</i> + 1')+' ⇒ TCX <i>y</i> = <i>x</i> − 2.'},
 {t:'tf',q:'Xét các khẳng định.',s:[['Đồ thị <i>y</i> = √(<i>x</i>² + 1)/<i>x</i> có hai tiệm cận ngang.',true],['Đồ thị hàm số bậc ba có tiệm cận ngang.',false],['Nếu lim[<i>f</i>(<i>x</i>) − (<i>ax</i> + <i>b</i>)] = 0 (<i>x</i> → +∞), <i>a</i> ≠ 0 thì <i>y</i> = <i>ax</i> + <i>b</i> là tiệm cận xiên.',true],['Mọi nghiệm của mẫu số đều cho một tiệm cận đứng.',false]],e:'Hai TCN là <i>y</i> = 1 và <i>y</i> = −1. Nghiệm của mẫu có thể cũng là nghiệm của tử (không cho TCĐ).'},
 {t:'match',q:'Ghép mỗi loại tiệm cận với dấu hiệu nhận biết.',p:[['Tiệm cận ngang','lim <i>f</i>(<i>x</i>) khi <i>x</i> → ±∞ bằng một số'],['Tiệm cận đứng','lim <i>f</i>(<i>x</i>) khi <i>x</i> → <i>x</i><sub>0</sub> bằng ±∞'],['Tiệm cận xiên','lim[<i>f</i>(<i>x</i>) − (<i>ax</i> + <i>b</i>)] = 0, <i>a</i> ≠ 0']],e:'Ngang, xiên: xét <i>x</i> ra vô cực; đứng: xét <i>x</i> dần tới <i>x</i><sub>0</sub>.'},
 {t:'in',q:'Đồ thị <i>y</i> = <i>x</i> + '+f('1','<i>x</i> + 2')+' có tiệm cận đứng <i>x</i> = <i>a</i>. Tìm <i>a</i>.',a:[-2],e:'Mẫu bằng 0 tại <i>x</i> = −2 và <i>y</i> → ±∞.'},
 {t:'mc',q:'Chi phí để loại bỏ <i>p</i>% chất ô nhiễm là <i>C</i>(<i>p</i>) = '+f('45<i>p</i>','100 − <i>p</i>')+'. Tiệm cận đứng <i>p</i> = 100 cho biết',o:['Không thể loại bỏ hoàn toàn 100% chất ô nhiễm','Chi phí giảm dần về 0','Chi phí luôn bằng 45','Chi phí không thay đổi'],e:'Khi <i>p</i> → 100⁻, chi phí tăng vô hạn.'},
 {t:'in',b:1,q:'Đồ thị <i>y</i> = '+f('<i>x</i>² + 3<i>x</i> + 1','<i>x</i> + 2')+' có tiệm cận xiên <i>y</i> = <i>ax</i> + <i>b</i>. Tính <i>a</i> + <i>b</i>.',a:[2],h:'Chia <i>x</i>² + 3<i>x</i> + 1 cho <i>x</i> + 2.',e:'<i>x</i>² + 3<i>x</i> + 1 = (<i>x</i> + 2)(<i>x</i> + 1) − 1 ⇒ TCX <i>y</i> = <i>x</i> + 1 ⇒ <i>a</i> + <i>b</i> = 2.'}
]);
bai(4,1,'Khảo sát sự biến thiên và vẽ đồ thị của hàm số',[
 {t:'order',q:'Sắp xếp các bước khảo sát và vẽ đồ thị hàm số.',s:['Tìm tập xác định.','Tính <i>y′</i>, xét dấu, tìm cực trị.','Tìm giới hạn, tiệm cận và lập bảng biến thiên.','Vẽ đồ thị.'],e:'Tập xác định → sự biến thiên → đồ thị.'},
 {t:'mc',q:'Tâm đối xứng của đồ thị <i>y</i> = −<i>x</i>³ + 3<i>x</i>² − 4 là',o:['(1; −2)','(0; −4)','(2; 0)','(−1; 0)'],h:'Hoành độ là nghiệm của <i>y″</i> = 0.',e:'<i>y″</i> = −6<i>x</i> + 6 = 0 ⇔ <i>x</i> = 1, <i>y</i>(1) = −2.'},
 {t:'mc',q:'Tâm đối xứng của đồ thị <i>y</i> = '+f('<i>x</i> + 1','<i>x</i> − 2')+' là',o:['(2; 1)','(1; 2)','(−2; 1)','(2; −1)'],e:'Giao của TCĐ <i>x</i> = 2 và TCN <i>y</i> = 1.'},
 {t:'in',q:'Tìm giá trị cực tiểu của hàm số <i>y</i> = '+f('<i>x</i>² − <i>x</i> − 1','<i>x</i> − 2')+'.',a:[5],h:'<i>y</i> = <i>x</i> + 1 + '+f('1','<i>x</i> − 2')+'.',e:'<i>y′</i> = 1 − '+f('1','(<i>x</i> − 2)²')+' = 0 ⇔ <i>x</i> = 1 hoặc <i>x</i> = 3; cực tiểu tại <i>x</i> = 3, <i>y</i> = 5.'},
 {t:'tf',q:'Xét các khẳng định.',s:[['Đồ thị hàm số bậc ba luôn có tâm đối xứng.',true],['Hàm số <i>y</i> = (<i>ax</i> + <i>b</i>)/(<i>cx</i> + <i>d</i>) (<i>c</i> ≠ 0, <i>ad</i> − <i>bc</i> ≠ 0) không có cực trị.',true],['Đồ thị <i>y</i> = (<i>x</i> + 1)/(<i>x</i> − 2) đi qua điểm (−1; 0).',true],['Hàm số <i>y</i> = <i>x</i>³ − 2<i>x</i>² + 2<i>x</i> − 1 có hai điểm cực trị.',false]],e:'<i>y′</i> = 3<i>x</i>² − 4<i>x</i> + 2 &gt; 0 với mọi <i>x</i> nên hàm số không có cực trị.'},
 {t:'in',q:'Đồ thị <i>y</i> = −<i>x</i>³ + 3<i>x</i>² − 4 cắt trục hoành tại bao nhiêu điểm?',a:[2],u:'điểm',e:'−<i>x</i>³ + 3<i>x</i>² − 4 = −(<i>x</i> + 1)(<i>x</i> − 2)² = 0 ⇔ <i>x</i> = −1 hoặc <i>x</i> = 2.'},
 {t:'mc',q:'Đạo hàm của <i>y</i> = '+f('<i>x</i> + 1','<i>x</i> − 2')+' là',o:[f('−3','(<i>x</i> − 2)²'),f('3','(<i>x</i> − 2)²'),f('1','(<i>x</i> − 2)²'),f('−1','(<i>x</i> − 2)²')],h:'('+f('<i>ax</i> + <i>b</i>','<i>cx</i> + <i>d</i>')+')′ = '+f('<i>ad</i> − <i>bc</i>','(<i>cx</i> + <i>d</i>)²')+'.',e:'<i>ad</i> − <i>bc</i> = 1 · (−2) − 1 · 1 = −3.'},
 {t:'in',q:'Chi phí trung bình mỗi sản phẩm là <i>f</i>(<i>x</i>) = '+f('2<i>x</i> + 45','<i>x</i>')+'. Đồ thị có tiệm cận ngang <i>y</i> = <i>a</i>. Tìm <i>a</i>.',a:[2],e:'lim<sub><i>x</i>→+∞</sub> <i>f</i>(<i>x</i>) = 2: chi phí trung bình giảm dần nhưng luôn lớn hơn 2.'},
 {t:'in',b:1,q:'Đồ thị <i>y</i> = '+f('<i>x</i>² + <i>x</i> − 2','<i>x</i> + 1')+' có tâm đối xứng <i>I</i>(<i>a</i>; <i>b</i>). Tính <i>a</i> + <i>b</i>.',a:[-2],h:'Tâm đối xứng là giao của TCĐ và TCX.',e:'<i>y</i> = <i>x</i> − '+f('2','<i>x</i> + 1')+': TCĐ <i>x</i> = −1, TCX <i>y</i> = <i>x</i> ⇒ <i>I</i>(−1; −1) ⇒ <i>a</i> + <i>b</i> = −2.'}
]);
bai(5,1,'Ứng dụng đạo hàm để giải quyết một số vấn đề thực tiễn',[
 {t:'mc',q:'Vật chuyển động có quãng đường <i>s</i>(<i>t</i>). Vận tốc tức thời của vật là',o:['<i>v</i>(<i>t</i>) = <i>s′</i>(<i>t</i>)','<i>v</i>(<i>t</i>) = <i>s″</i>(<i>t</i>)','<i>v</i>(<i>t</i>) = <i>s</i>(<i>t</i>)/<i>t</i>','<i>v</i>(<i>t</i>) = <i>s</i>(<i>t</i>)·<i>t</i>'],e:'Vận tốc là đạo hàm của quãng đường; gia tốc là đạo hàm của vận tốc.'},
 {t:'in',q:'Độ cao <i>h</i>(<i>t</i>) = 2 + 24,5<i>t</i> − 4,9<i>t</i>² (m). Tính vận tốc tại <i>t</i> = 2 (m/s).',a:[4.9],u:'m/s',e:'<i>v</i>(<i>t</i>) = 24,5 − 9,8<i>t</i> ⇒ <i>v</i>(2) = 4,9 m/s.'},
 {t:'in',q:'Với <i>h</i>(<i>t</i>) như trên, vật đạt độ cao lớn nhất tại thời điểm <i>t</i> bằng bao nhiêu giây?',a:[2.5],u:'giây',e:'<i>v</i>(<i>t</i>) = 0 ⇔ <i>t</i> = 2,5.'},
 {t:'in',q:'Chi phí <i>C</i>(<i>x</i>) = 30 000 + 300<i>x</i> − 2,5<i>x</i>² + 0,125<i>x</i>³ (nghìn đồng). Tính chi phí biên <i>C′</i>(200).',a:[14300],u:'nghìn đồng',e:'<i>C′</i>(<i>x</i>) = 300 − 5<i>x</i> + 0,375<i>x</i>² ⇒ <i>C′</i>(200) = 300 − 1000 + 15 000 = 14 300.'},

 {t:'mc',q:'Hàm số <i>F</i> là một nguyên hàm của <i>f</i> trên <i>K</i> nếu',o:['<i>F′</i>(<i>x</i>) = <i>f</i>(<i>x</i>) với mọi <i>x</i> ∈ <i>K</i>','<i>f′</i>(<i>x</i>) = <i>F</i>(<i>x</i>) với mọi <i>x</i> ∈ <i>K</i>','<i>F</i>(<i>x</i>) = <i>f</i>(<i>x</i>) + <i>C</i>','<i>F′</i>(<i>x</i>) = <i>f′</i>(<i>x</i>)'],e:'Nguyên hàm là phép toán ngược của đạo hàm.'},
 {t:'mc',q:'∫<i>x</i>³<i>dx</i> bằng',o:[f('<i>x</i>⁴','4')+' + <i>C</i>','3<i>x</i>² + <i>C</i>','<i>x</i>⁴ + <i>C</i>',f('<i>x</i>³','3')+' + <i>C</i>'],h:'Tăng mũ một, chia cho mũ mới.',e:'∫<i>x</i><sup>α</sup><i>dx</i> = '+f('<i>x</i><sup>α+1</sup>','α + 1')+' + <i>C</i>.'},
 {t:'mc',q:'∫sin <i>x dx</i> bằng',o:['−cos <i>x</i> + <i>C</i>','cos <i>x</i> + <i>C</i>','sin <i>x</i> + <i>C</i>','−sin <i>x</i> + <i>C</i>'],e:'(−cos <i>x</i>)′ = sin <i>x</i>.'},
 {t:'mc',q:'∫'+f('1','<i>x</i>')+'<i>dx</i> bằng',o:['ln|<i>x</i>| + <i>C</i>',f('1','<i>x</i>²')+' + <i>C</i>','−'+f('1','<i>x</i>²')+' + <i>C</i>','<i>x</i> + <i>C</i>'],e:'Trường hợp α = −1 của hàm luỹ thừa.'},
 {t:'tf',q:'Xét các khẳng định.',s:[['∫e<sup><i>x</i></sup><i>dx</i> = e<sup><i>x</i></sup> + <i>C</i>.',true],['∫'+f('1','cos²<i>x</i>')+'<i>dx</i> = tan <i>x</i> + <i>C</i>.',true],['∫2<sup><i>x</i></sup><i>dx</i> = 2<sup><i>x</i></sup> + <i>C</i>.',false],['∫<i>kf</i>(<i>x</i>)<i>dx</i> = <i>k</i>∫<i>f</i>(<i>x</i>)<i>dx</i> (<i>k</i> ≠ 0).',true]],e:'∫2<sup><i>x</i></sup><i>dx</i> = '+f('2<sup><i>x</i></sup>','ln 2')+' + <i>C</i>.'},
 {t:'in',q:'<i>F</i>(<i>x</i>) là một nguyên hàm của <i>f</i>(<i>x</i>) = 2<i>x</i> + 1 và <i>F</i>(0) = 3. Tính <i>F</i>(1).',a:[5],e:'<i>F</i>(<i>x</i>) = <i>x</i>² + <i>x</i> + <i>C</i>, <i>F</i>(0) = 3 ⇒ <i>C</i> = 3 ⇒ <i>F</i>(1) = 5.'},
 {t:'in',q:'Máy bay lăn bánh với vận tốc <i>v</i>(<i>t</i>) = 5 + 3<i>t</i> (m/s), <i>s</i>(0) = 0. Tính quãng đường đi được sau 30 giây.',a:[1500],u:'m',e:'<i>s</i>(<i>t</i>) = 5<i>t</i> + 1,5<i>t</i>² ⇒ <i>s</i>(30) = 150 + 1350 = 1500 m.'},
 {t:'match',q:'Ghép mỗi hàm số với họ nguyên hàm của nó.',p:[['cos <i>x</i>','sin <i>x</i> + <i>C</i>'],['e<sup><i>x</i></sup>','e<sup><i>x</i></sup> + <i>C</i>'],[f('1','sin²<i>x</i>'),'−cot <i>x</i> + <i>C</i>'],['<i>x</i>²',f('<i>x</i>³','3')+' + <i>C</i>']],e:'Đạo hàm vế phải để kiểm tra.'},
 {t:'in',b:1,q:'Doanh thu biên <i>R′</i>(<i>x</i>) = 300 − 0,1<i>x</i> (nghìn đồng), <i>R</i>(0) = 0. Tính doanh thu khi bán 1000 sản phẩm.',a:[250000],u:'nghìn đồng',e:'<i>R</i>(<i>x</i>) = 300<i>x</i> − 0,05<i>x</i>² ⇒ <i>R</i>(1000) = 300 000 − 50 000 = 250 000.'}
]);
bai(12,4,'Tích phân',[
 {t:'mc',q:tp('<i>a</i>','<i>b</i>')+'<i>f</i>(<i>x</i>)<i>dx</i> bằng (<i>F</i> là một nguyên hàm của <i>f</i>)',o:['<i>F</i>(<i>b</i>) − <i>F</i>(<i>a</i>)','<i>F</i>(<i>a</i>) − <i>F</i>(<i>b</i>)','<i>F</i>(<i>b</i>) + <i>F</i>(<i>a</i>)','<i>f</i>(<i>b</i>) − <i>f</i>(<i>a</i>)'],e:'Công thức Newton – Leibniz: cận trên trừ cận dưới.'},
 {t:'in',q:'Tính '+tp('−1','3')+'<i>x</i>²<i>dx</i> (làm tròn đến hàng phần trăm).',a:[9.33],e:f('<i>x</i>³','3')+' từ −1 đến 3: 9 − (−'+f('1','3')+') = '+f('28','3')+' ≈ 9,33.'},
 {t:'in',q:'Tính '+tp('0','π/6')+'cos <i>x dx</i>.',a:[0.5],e:'sin '+f('π','6')+' − sin 0 = 0,5.'},
 {t:'in',q:'Tính diện tích hình thang cong giới hạn bởi <i>y</i> = <i>x</i>³, trục hoành, <i>x</i> = 1, <i>x</i> = 2.',a:[3.75],e:tp('1','2')+'<i>x</i>³<i>dx</i> = '+f('16 − 1','4')+' = '+f('15','4')+'.'},
 {t:'in',q:'Tính '+tp('0','3')+'|<i>x</i> − 2|<i>dx</i>.',a:[2.5],h:'Tách tại <i>x</i> = 2.',e:tp('0','2')+'(2 − <i>x</i>)<i>dx</i> + '+tp('2','3')+'(<i>x</i> − 2)<i>dx</i> = 2 + 0,5 = 2,5.'},
 {t:'tf',q:'Xét các khẳng định.',s:[[tp('<i>a</i>','<i>a</i>')+'<i>f</i>(<i>x</i>)<i>dx</i> = 0.',true],[tp('<i>a</i>','<i>b</i>')+'<i>f</i> = −'+tp('<i>b</i>','<i>a</i>')+'<i>f</i>.',true],['Tích phân phụ thuộc vào tên biến số.',false],[tp('<i>a</i>','<i>b</i>')+'<i>f</i> = '+tp('<i>a</i>','<i>c</i>')+'<i>f</i> + '+tp('<i>c</i>','<i>b</i>')+'<i>f</i>.',true]],e:'Tích phân không phụ thuộc biến: ∫<i>f</i>(<i>x</i>)<i>dx</i> = ∫<i>f</i>(<i>t</i>)<i>dt</i>.'},
 {t:'in',q:'Ô tô đang chạy thì phanh, vận tốc <i>v</i>(<i>t</i>) = −40<i>t</i> + 20 (m/s). Tính quãng đường từ lúc phanh đến khi dừng (m).',a:[5],u:'m',h:'Dừng khi <i>v</i> = 0.',e:'<i>t</i> = 0,5; '+tp('0','0,5')+'(−40<i>t</i> + 20)<i>dt</i> = 5 m.'},
 {t:'in',q:'Tính '+tp('−1','1')+'√(1 − <i>x</i>²)<i>dx</i> (làm tròn đến hàng phần trăm).',a:[1.57],h:'Ý nghĩa hình học: nửa hình tròn.',e:'Diện tích nửa hình tròn bán kính 1: '+f('π','2')+' ≈ 1,57.'},
 {t:'in',b:1,q:'Nhiệt độ <i>T</i>(<i>t</i>) = 20 + 1,5(<i>t</i> − 6) (°C) với 6 ≤ <i>t</i> ≤ 12. Tính nhiệt độ trung bình trong khoảng thời gian đó.',a:[24.5],u:'°C',h:'Giá trị trung bình '+f('1','<i>b</i> − <i>a</i>')+tp('<i>a</i>','<i>b</i>')+'<i>T</i>(<i>t</i>)<i>dt</i>.',e:f('1','6')+tp('6','12')+'[20 + 1,5(<i>t</i> − 6)]<i>dt</i> = '+f('1','6')+'(120 + 27) = 24,5 °C.'}
]);
bai(13,4,'Ứng dụng hình học của tích phân',[
 {t:'mc',q:'Diện tích hình phẳng giới hạn bởi <i>y</i> = <i>f</i>(<i>x</i>), trục hoành, <i>x</i> = <i>a</i>, <i>x</i> = <i>b</i> là',o:[tp('<i>a</i>','<i>b</i>')+'|<i>f</i>(<i>x</i>)|<i>dx</i>',tp('<i>a</i>','<i>b</i>')+'<i>f</i>(<i>x</i>)<i>dx</i>','π'+tp('<i>a</i>','<i>b</i>')+'<i>f</i>²(<i>x</i>)<i>dx</i>','|'+tp('<i>b</i>','<i>a</i>')+'<i>f</i>(<i>x</i>)<i>dx</i>|'],e:'Diện tích luôn không âm nên lấy trị tuyệt đối dưới dấu tích phân.'},
 {t:'in',q:'Tính diện tích hình phẳng giới hạn bởi <i>y</i> = <i>x</i>³, trục hoành, <i>x</i> = 0, <i>x</i> = 2.',a:[4],e:tp('0','2')+'<i>x</i>³<i>dx</i> = 4.'},
 {t:'in',q:'Tính diện tích hình phẳng giới hạn bởi <i>y</i> = sin <i>x</i>, trục hoành, <i>x</i> = 0, <i>x</i> = 2π.',a:[4],h:'Tách tại <i>x</i> = π.',e:tp('0','π')+'sin <i>x dx</i> − '+tp('π','2π')+'sin <i>x dx</i> = 2 + 2 = 4.'},
 {t:'in',q:'Tính diện tích hình phẳng giới hạn bởi <i>y</i> = 4 − <i>x</i>², <i>y</i> = <i>x</i>², <i>x</i> = −1, <i>x</i> = 1 (làm tròn đến hàng phần trăm).',a:[6.67],e:tp('−1','1')+'(4 − 2<i>x</i>²)<i>dx</i> = 8 − '+f('4','3')+' = '+f('20','3')+' ≈ 6,67.'},
 {t:'mc',q:'Thể tích khối tròn xoay khi quay hình phẳng (<i>y</i> = <i>f</i>(<i>x</i>), trục hoành, <i>x</i> = <i>a</i>, <i>x</i> = <i>b</i>) quanh <i>Ox</i> là',o:['π'+tp('<i>a</i>','<i>b</i>')+'<i>f</i>²(<i>x</i>)<i>dx</i>',tp('<i>a</i>','<i>b</i>')+'<i>f</i>²(<i>x</i>)<i>dx</i>','π'+tp('<i>a</i>','<i>b</i>')+'<i>f</i>(<i>x</i>)<i>dx</i>','2π'+tp('<i>a</i>','<i>b</i>')+'<i>f</i>(<i>x</i>)<i>dx</i>'],e:'Mặt cắt là hình tròn bán kính |<i>f</i>(<i>x</i>)|, diện tích π<i>f</i>²(<i>x</i>).'},
 {t:'in',q:'Quay hình phẳng giới hạn bởi <i>y</i> = √<i>x</i>, trục hoành, <i>x</i> = 0, <i>x</i> = 1 quanh <i>Ox</i>. Tính thể tích (làm tròn đến hàng phần trăm).',a:[1.57],e:'<i>V</i> = π'+tp('0','1')+'<i>x dx</i> = '+f('π','2')+' ≈ 1,57.'},
 {t:'tf',q:'Xét các khẳng định.',s:[['Mặt cắt khối tròn xoay (quay quanh <i>Ox</i>) bởi mặt phẳng vuông góc với <i>Ox</i> là hình tròn.',true],['Thể tích khối cầu bán kính <i>R</i> là '+f('4','3')+'π<i>R</i>³.',true],['Diện tích hình phẳng có thể là số âm.',false],['<i>V</i> = '+tp('<i>a</i>','<i>b</i>')+'<i>S</i>(<i>x</i>)<i>dx</i> với <i>S</i>(<i>x</i>) là diện tích mặt cắt.',true]],e:'Diện tích luôn không âm.'},
 {t:'in',q:'Quay hình phẳng giới hạn bởi <i>y</i> = '+f('<i>x</i>','2')+', trục hoành, <i>x</i> = 0, <i>x</i> = 4 quanh <i>Ox</i> (khối nón). Tính thể tích (làm tròn đến hàng phần trăm).',a:[16.76],e:'<i>V</i> = π'+tp('0','4')+f('<i>x</i>²','4')+'<i>dx</i> = '+f('16π','3')+' ≈ 16,76 (khớp '+f('1','3')+'π<i>R</i>²<i>h</i> với <i>R</i> = 2, <i>h</i> = 4).'},
 {t:'in',b:1,q:'Tính diện tích hình phẳng giới hạn bởi <i>y</i> = <i>x</i>² và <i>y</i> = <i>x</i> + 2.',a:[4.5],h:'Giao điểm: <i>x</i>² = <i>x</i> + 2.',e:'<i>x</i> = −1, <i>x</i> = 2; <i>S</i> = '+tp('−1','2')+'(<i>x</i> + 2 − <i>x</i>²)<i>dx</i> = '+f('10','3')+' + '+f('7','6')+' = 4,5.'}
]);

bai(14,5,'Phương trình mặt phẳng',[
 {t:'mc',q:'Một vectơ pháp tuyến của mặt phẳng <i>x</i> + 2<i>y</i> − <i>z</i> + 1 = 0 là',o:['(1; 2; −1)','(1; 2; 1)','(2; 4; 2)','(−1; 2; 1)'],e:'Mặt phẳng <i>Ax</i> + <i>By</i> + <i>Cz</i> + <i>D</i> = 0 có VTPT (<i>A</i>; <i>B</i>; <i>C</i>).'},
 {t:'in',q:'Cho '+v('u')+' = (1; −2; 0), '+v('v')+' = (3; 1; −4). Tích có hướng ['+v('u')+', '+v('v')+'] = (<i>a</i>; <i>b</i>; <i>c</i>). Tính <i>a</i> + <i>b</i> + <i>c</i>.',a:[19],h:'[u, v] = (<i>bc′</i> − <i>b′c</i>; <i>ca′</i> − <i>c′a</i>; <i>ab′</i> − <i>a′b</i>).',e:'['+v('u')+', '+v('v')+'] = (8; 4; 7) ⇒ tổng 19.'},
 {t:'mc',q:'Mặt phẳng đi qua <i>M</i>(2; −1; 0) và có VTPT (3; −4; 6) có phương trình',o:['3<i>x</i> − 4<i>y</i> + 6<i>z</i> − 10 = 0','3<i>x</i> − 4<i>y</i> + 6<i>z</i> + 10 = 0','2<i>x</i> − <i>y</i> − 10 = 0','3<i>x</i> + 4<i>y</i> + 6<i>z</i> − 2 = 0'],e:'3(<i>x</i> − 2) − 4(<i>y</i> + 1) + 6<i>z</i> = 0 ⇔ 3<i>x</i> − 4<i>y</i> + 6<i>z</i> − 10 = 0.'},
 {t:'in',q:'Tính khoảng cách từ <i>M</i>(1; 2; −1) đến (<i>P</i>): <i>x</i> + 2<i>y</i> − 2<i>z</i> + 5 = 0.',a:[4],e:f('|1 + 4 + 2 + 5|','√(1 + 4 + 4)')+' = '+f('12','3')+' = 4.'},
 {t:'tf',q:'Xét các khẳng định.',s:[['Hai mặt phẳng <i>x</i> − 3<i>y</i> + 2<i>z</i> + 1 = 0 và 5<i>x</i> + <i>y</i> − <i>z</i> + 2 = 0 vuông góc với nhau.',true],['['+v('u')+', '+v('v')+'] = '+v('0')+' khi '+v('u')+', '+v('v')+' cùng phương.',true],['Mặt phẳng <i>y</i> + 1 = 0 có VTPT (0; 1; 0).',true],['Hai mặt phẳng <i>x</i> + <i>y</i> + <i>z</i> − 1 = 0 và 2<i>x</i> + 2<i>y</i> + 2<i>z</i> − 2 = 0 song song.',false]],e:'Ý 1: 5 − 3 − 2 = 0. Ý 4: hai phương trình tỉ lệ cả hệ số tự do nên hai mặt phẳng trùng nhau.'},
 {t:'order',q:'Sắp xếp các bước viết phương trình mặt phẳng đi qua ba điểm <i>A</i>, <i>B</i>, <i>C</i> không thẳng hàng.',s:['Tính '+v('AB')+', '+v('AC')+'.','Tính VTPT '+v('n')+' = ['+v('AB')+', '+v('AC')+'].','Viết phương trình qua <i>A</i> nhận '+v('n')+' làm VTPT.','Rút gọn về dạng <i>Ax</i> + <i>By</i> + <i>Cz</i> + <i>D</i> = 0.'],e:'Cặp VTCP → tích có hướng → phương trình.'},
 {t:'in',q:'Tính khoảng cách từ gốc toạ độ đến (<i>P</i>): 2<i>x</i> + 2<i>y</i> − <i>z</i> + 1 = 0 (làm tròn đến hàng phần trăm).',a:[0.33],e:f('|1|','√(4 + 4 + 1)')+' = '+f('1','3')+' ≈ 0,33.'},
 {t:'mc',q:'Mặt phẳng cắt các trục toạ độ tại <i>A</i>(2; 0; 0), <i>B</i>(0; 3; 0), <i>C</i>(0; 0; 4) có phương trình',o:[f('<i>x</i>','2')+' + '+f('<i>y</i>','3')+' + '+f('<i>z</i>','4')+' = 1','2<i>x</i> + 3<i>y</i> + 4<i>z</i> = 1',f('<i>x</i>','2')+' + '+f('<i>y</i>','3')+' + '+f('<i>z</i>','4')+' = 0','<i>x</i> + <i>y</i> + <i>z</i> = 9'],e:'Phương trình mặt phẳng theo đoạn chắn.'},
 {t:'in',b:1,q:'Mặt phẳng (<i>ABC</i>) với <i>A</i>(2; 1; −1), <i>B</i>(3; 2; 1), <i>C</i>(3; 1; 4) có phương trình 5<i>x</i> − 3<i>y</i> − <i>z</i> + <i>D</i> = 0. Tìm <i>D</i>.',a:[-8],h:'Thay toạ độ <i>A</i>.',e:v('n')+' = ['+v('AB')+', '+v('AC')+'] = (5; −3; −1); 5 · 2 − 3 · 1 + 1 + <i>D</i> = 0 ⇒ <i>D</i> = −8.'}
]);
bai(15,5,'Phương trình đường thẳng trong không gian',[
 {t:'mc',q:'Đường thẳng Δ: <i>x</i> = −1 + 3<i>t</i>, <i>y</i> = 1, <i>z</i> = 2<i>t</i> có một vectơ chỉ phương là',o:['(3; 0; 2)','(−1; 1; 0)','(3; 1; 2)','(−1; 0; 2)'],e:'Hệ số của <i>t</i>: (3; 0; 2).'},

 return o;
}

 </div><div id="fb"></div></div>`;
 ({mc:rMC,tf:rTF,in:rIN,match:rMT,order:rOR})[q.t](q);

}
function useHint(){const q=P.qs[P.i];if(P.hint||P.answered||!q.h)return;P.hint=true;P.usedHelp=true;document.getElementById('phint').disabled=true;document.getElementById('hintbox').innerHTML=`<div class="hintbox">💡 ${q.h}</div>`}
function use50(){const q=P.qs[P.i];if(P.fifty||P.answered||q.t!='mc')return;P.fifty=true;P.usedHelp=true;document.getElementById('p50').disabled=true;const wrong=shuffle(q.opts.map((o,i)=>i).filter(i=>!q.opts[i].ok)).slice(0,2);wrong.forEach(i=>document.querySelectorAll('.opt')[i].classList.add('gone'))}
function act(html){document.getElementById('act').innerHTML=html}

/* -- Trắc nghiệm -- */
function rMC(q){document.getElementById('body').innerHTML=`<div class="opts">${q.opts.map((o,i)=>`<button class="opt" onclick="pickMC(${i})"><span class="lt">${'ABCD'[i]}</span><span>${o.t}</span></button>`).join('')}</div>`}
function pickMC(i){if(P.answered)return;const q=P.qs[P.i],bs=document.querySelectorAll('.opt');const ok=q.opts[i].ok;bs.forEach((b,k)=>{b.disabled=true;if(q.opts[k].ok)b.classList.add('ok')});if(!ok)bs[i].classList.add('bad');finish(ok?1:0,ok,!ok)}
/* -- Đúng/Sai -- */
function rTF(q){document.getElementById('body').innerHTML=`<div class="tf">${q.s.map((s,i)=>`<div class="tfr" id="tf${i}"><span class="lb">${'abcd'[i]})</span><span class="tx">${s[0]}</span><span class="tfb"><button class="d" onclick="pickTF(${i},true)">Đ</button><button class="s" onclick="pickTF(${i},false)">S</button></span></div>`).join('')}</div>`;act(`<button class="btn" id="chk" onclick="checkTF()" disabled>Kiểm tra</button>`)}
function pickTF(i,v){if(P.answered)return;SND.tap();const q=P.qs[P.i];q.pick[i]=v;const r=document.getElementById('tf'+i);r.querySelector('.d').classList.toggle('on',v===true);r.querySelector('.s').classList.toggle('on',v===false);document.getElementById('chk').disabled=q.pick.some(x=>x===null)}
function checkTF(){if(P.answered)return;const q=P.qs[P.i];if(q.pick.some(x=>x===null))return;let k=0;q.s.forEach((s,i)=>{const ok=q.pick[i]===s[1];if(ok)k++;const r=document.getElementById('tf'+i);r.classList.add(ok?'ok':'bad');r.insertAdjacentHTML('beforeend',`<span class="kq">${ok?'✔':'✘'} ${s[1]?'Đúng':'Sai'}</span>`);r.querySelectorAll('button').forEach(b=>b.disabled=true)});act('');const cr=[0,.1,.25,.5,1][k];finish(cr,k==q.s.length,k<3,`${k}/${q.s.length} ý đúng`)}
/* -- Trả lời ngắn -- */
function parseNum(s){s=String(s).trim().replace(/−|–/g,'-').replace(/\s+/g,'').replace(/,/g,'.');if(!s)return NaN;const m=s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);if(m)return parseFloat(m[1])/parseFloat(m[2]);if(/^-?\d*\.?\d+$/.test(s))return parseFloat(s);return NaN}
function rIN(q){document.getElementById('body').innerHTML=`<div class="inp"><input id="ans" autocomplete="off" placeholder="Gõ đáp số…" onkeydown="if(event.key=='Enter'){event.stopPropagation();checkIN()}">${q.u?`<b>${q.u}</b>`:''}</div><div class="hint-in">Nhập số nguyên, số thập phân (dấu phẩy hoặc chấm) hoặc phân số dạng a/b${q.a.some(x=>!Number.isInteger(x))&&!q.tol?'. Số thập phân vô hạn: làm tròn đến hàng phần trăm.':'.'}</div>`;act(`<button class="btn" onclick="checkIN()">Kiểm tra</button>`);setTimeout(()=>{const a=document.getElementById('ans');a&&a.focus()},50)}
function checkIN(){if(P.answered)return;const q=P.qs[P.i],el=document.getElementById('ans'),x=parseNum(el.value);if(isNaN(x)){el.classList.add('bad');setTimeout(()=>el.classList.remove('bad'),400);return}
 const tol=q.tol!=null?q.tol:(q.a.every(Number.isInteger)?1e-9:.006);const ok=q.a.some(a=>Math.abs(a-x)<=tol+1e-12);el.classList.add(ok?'ok':'bad');el.disabled=true;act('');finish(ok?1:0,ok,!ok)}
/* -- Ghép đôi -- */
const MC=['#2563eb','#16a34a','#db2777','#ea580c','#9333ea','#0891b2'];
function rMT(q){const b=document.getElementById('body');b.innerHTML=`<div class="mt"><div class="col">${q.L.map(i=>`<button class="mi" id="ml${i}" onclick="mtL(${i})">${q.p[i][0]}</button>`).join('')}</div><div class="col">${q.R.map(i=>`<button class="mi" id="mr${i}" onclick="mtR(${i})">${q.p[i][1]}</button>`).join('')}</div></div><div class="hint-in">Bấm một ô bên trái rồi bấm ô tương ứng bên phải.</div>`;q.sel=null}
function mtL(i){const q=P.qs[P.i];if(P.answered||q.done[i]!=null)return;SND.tap();document.querySelectorAll('.mi.sel').forEach(x=>x.classList.remove('sel'));q.sel=i;document.getElementById('ml'+i).classList.add('sel')}
function mtR(j){const q=P.qs[P.i];if(P.answered||q.sel==null||Object.values(q.done).includes(j))return;const i=q.sel,l=document.getElementById('ml'+i),r=document.getElementById('mr'+j);
 if(i==j){const n=Object.keys(q.done).length,c=MC[n%MC.length];q.done[i]=j;[l,r].forEach(e=>{e.classList.remove('sel');e.classList.add('done');e.style.background=c;e.style.borderColor=c});q.sel=null;SND.ok();
  if(Object.keys(q.done).length==q.p.length){const m=q.miss;finish([1,.75,.5,.25][Math.min(m,3)],m==0,m>1,m?`Sai ${m} lần ghép`:'')}}
 else{q.miss++;SND.bad();r.classList.add('bad');setTimeout(()=>r.classList.remove('bad'),450)}}
/* -- Sắp xếp -- */
function rOR(q){const b=document.getElementById('body');b.innerHTML=`<div class="ordz"><div class="lbl">THỨ TỰ CỦA EM (bấm để bỏ ra)</div>${q.s.map((x,k)=>{const i=q.ans[k];return i==null?`<div class="oi empty">Bước ${k+1}</div>`:`<button class="oi" onclick="orOut(${k})"><span class="n">${k+1}</span><span>${q.s[i]}</span></button>`}).join('')}
 <div class="lbl">CÁC BƯỚC (bấm để xếp vào)</div>${q.pool.map((i,k)=>`<button class="oi" onclick="orIn(${k})"><span class="n">?</span><span>${q.s[i]}</span></button>`).join('')||'<div class="hint-in">Đã xếp hết — bấm Kiểm tra.</div>'}</div>`;act(`<button class="btn" onclick="checkOR()" ${q.pool.length?'disabled':''}>Kiểm tra</button>`)}
function orIn(k){const q=P.qs[P.i];if(P.answered)return;SND.tap();q.ans.push(q.pool.splice(k,1)[0]);rOR(q)}
function orOut(k){const q=P.qs[P.i];if(P.answered)return;SND.tap();q.pool.push(q.ans.splice(k,1)[0]);rOR(q)}
function checkOR(){if(P.answered)return;const q=P.qs[P.i];if(q.pool.length)return;let k=0;q.ans.forEach((x,i)=>{if(x==i)k++});const ok=k==q.s.length;
 document.getElementById('body').innerHTML=`<div class="ordz">${q.ans.map((x,i)=>`<div class="oi ${x==i?'ok':'bad'}"><span class="n">${i+1}</span><span>${q.s[x]}</span></div>`).join('')}${ok?'':`<div class="lbl">THỨ TỰ ĐÚNG</div>${q.s.map((s,i)=>`<div class="oi ok"><span class="n">${i+1}</span><span>${s}</span></div>`).join('')}`}</div>`;act('');finish(ok?1:k/q.s.length*.5,ok,!ok,ok?'':`${k}/${q.s.length} bước đúng vị trí`)}

/* -- Hết giờ -- */
function timeUp(){const q=P.qs[P.i];document.querySelectorAll('#body button,#body input').forEach(b=>b.disabled=true);act('');
 if(q.t=='mc')document.querySelectorAll('.opt').forEach((b,k)=>{if(q.opts[k].ok)b.classList.add('ok')});
 finish(0,false,true,'⏰ Hết giờ!')}

/* -- Chấm & phản hồi -- */
function finish(credit,ok,lose,extra){
 if(P.answered)return;P.answered=true;stopTimer();
 const q=P.qs[P.i],el=(Date.now()-P.t0)/1000;
 document.getElementById('p50').disabled=true;document.getElementById('phint').disabled=true;
 if(ok){P.combo++;P.nOk++;P.maxCombo=Math.max(P.maxCombo,P.combo);if(P.combo>=5)award('combo5');if(P.combo>=10)award('combo10');if(el<=5)award('speed')}else P.combo=0;
 const base=q.b?200:100,tb=ok&&S.set.timer?Math.round(50*Math.max(0,1-el/P.tl)):0,mul=1+.1*Math.min(Math.max(P.combo-1,0),5);
 const pts=Math.round((base*credit+tb)*(ok?mul:1));P.score+=pts;P.credit+=credit;
 if(lose){P.hearts--;const h=document.getElementById('hs');h.innerHTML='❤️'.repeat(P.hearts)+'🤍'.repeat(P.maxH-P.hearts);h.classList.add('lost')}
 ok?SND.ok():SND.bad();
 let ans='';
 if(q.t=='in')ans=`<p>Đáp số: <b>${q.d||q.a.map(x=>String(x).replace('.',',')).join(' hoặc ')}${q.u?' '+q.u:''}</b></p>`;
 const cls=ok?'ok':(credit>0?'mid':'bad');
 const ttl=ok?['🎉 Chính xác!','🌟 Xuất sắc!','💯 Quá đỉnh!','🚀 Tuyệt vời!'][Math.random()*4|0]:(credit>0?'👍 Gần đúng rồi!':'😮 Chưa đúng rồi!');
 const last=P.i==P.qs.length-1||P.hearts<=0;
 document.getElementById('fb').innerHTML=`<div class="fb ${cls}"><h4>${ttl} ${pts?`<span style="float:right">+${pts} 💎</span>`:''}</h4>${extra?`<div>${extra}</div>`:''}${ok&&P.combo>=2?`<div>🔥 Combo ×${P.combo}!</div>`:''}${lose?`<div>💔 Mất 1 mạng — còn ${P.hearts} ❤️</div>`:''}${ans}${q.e?`<div class="ex"><b class="k">📖 Giải thích:</b> ${q.e}</div>`:''}<button class="btn ${ok?'ok':''}" id="nx" onclick="next()">${last?'🏁 Xem kết quả':'Tiếp tục ➜'}</button></div>`;
 document.getElementById('fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function next(){if(P.hearts<=0||P.i>=P.qs.length-1)return result();P.i++;renderQ();window.scrollTo(0,0)}
function quit(){const d=document.createElement('div');d.className='ov-bg';d.innerHTML=`<div class="modal" style="text-align:center"><h3>Rời thử thách?</h3><p>Kết quả lượt này sẽ không được tính.</p><div class="row" style="justify-content:center"><button class="btn white" onclick="this.closest('.ov-bg').remove()">Chơi tiếp</button><button class="btn" onclick="this.closest('.ov-bg').remove();map()">Về bản đồ</button></div></div>`;document.body.appendChild(d)}

/* ===== Kết quả ===== */
function result(){
 stopTimer();const n=P.qs.length,acc=P.credit/n,dead=P.hearts<=0;
 const st=dead?0:acc>=.9?3:acc>=.7?2:acc>=.5?1:0,k=P.key,old=S.stars[k]||0;
 if(st>old)S.stars[k]=st;if(P.score>(S.best[k]||0))S.best[k]=P.score;S.xp+=P.score;
 if(st>=1&&k[0]=='b')award('first');if(st==3&&k[0]=='b')award('perfect');if(st==3&&!P.usedHelp)award('nohint');if(st>=1&&k[0]=='c')award('boss');if(st>=1&&k=='rand')award('random');
 if(CH.every(c=>lessonsOf(c.id).some(b=>S.stars['b'+b.so])))award('explore');
 if(BAI.every(b=>S.stars['b'+b.so]))award('all');if(totalStars()>=35)award('star50');if(totalStars()>=70)award('legend');
 save();
 let nextBtn='';
 if(k[0]=='b'&&st){const b=BAI.find(x=>'b'+x.so==k),ls=lessonsOf(b.ch),i=ls.indexOf(b);if(i<ls.length-1)nextBtn=`<button class="btn gold" onclick="intro('b${ls[i+1].so}')">➡️ Trạm tiếp theo</button>`;else if(isOpen('c'+b.ch))nextBtn=`<button class="btn gold" onclick="intro('c${b.ch}')">👹 Đấu Trùm chương</button>`}
 const msg=dead?'💔 Hết mạng rồi! Ôn lại phần giải thích rồi thử lại nhé.':st==3?'🏆 Chinh phục trọn vẹn!':st==2?'👏 Rất tốt! Thêm chút nữa là 3 sao.':st==1?'✅ Qua trạm! Chơi lại để lấy thêm sao nhé.':'📚 Chưa đạt 50%. Ôn lại và thử lần nữa nhé!';
 const c=P.ch?chOf(P.ch).mau:'#1d4ed8';
 app.innerHTML=`<div class="wrap"><div class="res" style="--c:${c}"><div style="font-weight:800;color:var(--muted)">${P.title}</div>
 <div class="stars">${[0,1,2].map(i=>`<span class="${i<st?'':'off'}" style="animation-delay:${.2+i*.25}s">⭐</span>`).join('')}</div>
 <h2 style="margin:0">${msg}</h2>
 <div class="kpis"><div class="kpi"><b>${P.score.toLocaleString('vi-VN')}</b><span>💎 điểm</span></div><div class="kpi"><b>${Math.round(acc*100)}%</b><span>🎯 chính xác</span></div><div class="kpi"><b>×${P.maxCombo}</b><span>🔥 combo dài nhất</span></div></div>
 <div>Trả lời đúng hoàn toàn <b>${P.nOk}/${n}</b> câu · ${dead?'đã dừng ở câu '+(P.i+1):'còn '+P.hearts+' ❤️'}</div>
 ${NEWB.map(id=>{const b=BADGES.find(x=>x[0]==id);return `<div class="newb">🎖️ Huy hiệu mới: <b>${b[1]} ${b[2]}</b> — ${b[3]}</div>`}).join('')}
 <div class="row" style="justify-content:center"><button class="btn" onclick="start('${k}')">🔁 Chơi lại</button>${nextBtn}<button class="btn white" onclick="map()">🗺️ Bản đồ</button></div></div></div>`;
 window.scrollTo(0,0);if(st>=1){SND.win();confetti()}else SND.lose();
}

/* ===== Huy hiệu & cài đặt ===== */
function badges(){const d=document.createElement('div');d.className='ov-bg';d.innerHTML=`<div class="modal"><h3>🏅 Huy hiệu (${Object.keys(S.badges).length}/${BADGES.length})</h3><div class="badges">${BADGES.map(b=>`<div class="bd ${S.badges[b[0]]?'':'off'}"><div class="e">${b[1]}</div><b>${b[2]}</b><span>${b[3]}</span></div>`).join('')}</div><div class="row"><button class="btn" onclick="this.closest('.ov-bg').remove()">Đóng</button></div></div>`;d.onclick=e=>{if(e.target==d)d.remove()};document.body.appendChild(d)}
function settings(){const d=document.createElement('div');d.className='ov-bg';const t=(k,l,s)=>`<label class="tg"><span><b>${l}</b><br><small style="color:var(--muted)">${s}</small></span><input type="checkbox" ${S.set[k]?'checked':''} onchange="S.set.${k}=this.checked;save();document.body.classList.toggle('big',!!S.set.big)"></label>`;
 d.innerHTML=`<div class="modal"><h3>⚙️ Cài đặt</h3>${t('timer','⏱️ Đồng hồ đếm ngược','Tắt khi chơi cả lớp trên máy chiếu, cần thời gian thảo luận')}${t('sound','🔊 Âm thanh','Tiếng báo đúng / sai')}${t('big','🔠 Chữ to (chiếu TV)','Phóng to chữ cho cả lớp cùng nhìn')}${t('unlock','🔓 Mở khoá mọi trạm (dành cho GV)','Chọn thẳng bài đang dạy, không cần vượt trạm trước')}
 <div class="row"><button class="btn white" onclick="if(confirm('Xoá toàn bộ sao, điểm, huy hiệu trên máy này?')){S.stars={};S.best={};S.xp=0;S.badges={};save();this.closest('.ov-bg').remove();home()}">🗑️ Chơi lại từ đầu</button><button class="btn" onclick="this.closest('.ov-bg').remove();if(!document.querySelector('.play'))(document.querySelector('.mapbar')?map:home)()">Xong</button></div>
 <p class="note"><span class="draft">✅ BẢN NHÁP — thầy/cô duyệt trước khi dùng</span></p></div>`;document.body.appendChild(d)}

/* ===== Phím tắt ===== */
document.addEventListener('keydown',e=>{
 if(document.querySelector('.ov-bg'))return;
 if(!P||!document.querySelector('.play'))return;
 const q=P.qs[P.i];
 if(e.key=='Enter'){const nx=document.getElementById('nx');if(nx){nx.click();e.preventDefault();return}const b=document.querySelector('#act .btn');if(b&&!b.disabled)b.click();return}
 if(q.t=='mc'&&!P.answered){const k='1234'.indexOf(e.key)>=0?'1234'.indexOf(e.key):'abcd'.indexOf(e.key.toLowerCase());if(k>=0&&e.target.tagName!='INPUT'){const o=document.querySelectorAll('.opt')[k];if(o&&!o.classList.contains('gone'))pickMC(k)}}
});
